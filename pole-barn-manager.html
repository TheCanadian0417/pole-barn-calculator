<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pole Barn Manager</title>
<link rel="icon" href="https://yourlegacybuilding.com/wp-content/uploads/2026/07/LB_Primary_BY_01.png" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --gold:#D4AF37; --gold-dark:#b8942d; --ink:#1c1f23; --muted:#6c757d; }
  body { background:#f3f3f1; color:var(--ink); }
  .btn-brand { background:var(--gold); border:1px solid var(--gold); color:#1c1f23; font-weight:700; }
  .btn-brand:hover,.btn-brand:focus { background:var(--gold-dark); border-color:var(--gold-dark); color:#fff; }
  .btn-brand:disabled { background:#d3d3ce; border-color:#d3d3ce; color:#85857f; }
  .app-header { background:var(--ink); color:#fff; border-radius:.5rem; }
  .app-header .eyebrow { color:var(--gold); letter-spacing:.18em; text-transform:uppercase; font-size:.7rem; font-weight:600; }
  .card-title-bar { background:var(--ink); color:#fff; letter-spacing:.09em; text-transform:uppercase; font-size:.78rem; font-weight:600; }
  .cat-hdr { background:var(--ink); color:#fff; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; font-weight:600; padding:.35rem .6rem; }
  .lockwrap { position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:1080; }
  .est-num { font-variant-numeric:tabular-nums; }
  table td, table th { font-size:.9rem; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================  VALIDATED ENGINE (verbatim)  ===================== */
const PRICE_KEYS = [
  "post_6x6", "post_8x8", "post_10x10", "syp_2x6x10", "syp_2x6x12", "syp_2x6x14",
  "truss_open_0_45", "truss_open_46_55", "truss_open_56_60", "truss_open_61_65",
  "truss_leanto_0_20", "truss_leanto_21_30", "wood_screw_bag", "rebar_18in",
  "carriage_bolt_6x6", "carriage_bolt_8x8", "carriage_bolt_10x10", "metal_29ga_galv",
  "metal_29ga_colored", "metal_26ga_galv", "metal_26ga_colored", "ridge_cap_galv",
  "ridge_cap_colored", "gable_rake_barn_galv", "gable_rake_barn_colored", "gable_rake_galv",
  "gable_rake_colored", "drip_edge_galv", "drip_edge_colored", "fascia_trim_galv",
  "fascia_trim_colored", "concrete_yard", "concrete_truck", "concrete_bag", "blueprints",
  "metal_delivery", "delivery_install", "delivery_kit", "install_floor",
  "install_rate_base_6x6", "install_rate_base_8x8", "install_rate_regular_6x6",
  "install_rate_regular_8x8", "install_rate_premium_6x6", "install_rate_default",
  "zone_1_margin", "zone_2_margin", "pt_2x6x10", "pt_2x6x12", "pt_2x6x14", "zflashing_colored",
  "zflashing_galv", "jchannel_colored", "jchannel_galv", "outside_corner_trim_colored",
  "outside_corner_trim_galv", "deck_screw_3in_box", "blueprints_option", "post_6x6x20",
  "closure_labor_rate", "closure_labor_floor", "closure_gable_rate", "closure_gable_floor"
];

/* ==========================================================================
   3. MODELS — each tier declares its default post size and its trim set.
   ==========================================================================
   Adding or moving a trim piece between tiers later is a one-line change.    */
const MODELS = {
  Base:    { defaultPost: "6x6",
             trim: ["ridgeCap", "gableRake"] },
  Regular: { defaultPost: "6x6",
             trim: ["ridgeCap", "gableRake", "fasciaTrim", "fasciaBoards"],
             fasciaTrimQtyFrom: "dripEdge" },   // Regular quantifies fascia off drip-edge length
  Premium: { defaultPost: "8x8",
             trim: ["ridgeCap", "gableRake", "dripEdge", "fasciaTrim", "fasciaBoards"],
             fasciaTrimQtyFrom: "fasciaTrim" }, // Premium quantifies off FasciaTrimAmt
};

/* ==========================================================================
   4. QUANTITY FORMULAS — ported from CalculatorService.cs, following the
      FileMaker scripts wherever the two disagreed.
   ==========================================================================
   barn = { width, length, poleSpacing, postSize, roofType, gauge, finish, model } */

function postAmt(b) {
  if (b.roofType === "OpenRoof") return (b.length / b.poleSpacing) * 2 + 2;
  if (b.roofType === "LeanTo")   return (b.length / b.poleSpacing) + 1;
  return 0;
}

// Boards spanning the width, per bay.
function roofBoardsPerWidth(b) {
  if (b.roofType === "OpenRoof") return (b.width / 2) + 4;
  if (b.roofType === "LeanTo")   return (b.width / 2) + 2;
  return 0;
}
const EXTERIOR_BAYS = 2;
function boardsForExteriorBays(b) { return roofBoardsPerWidth(b) * EXTERIOR_BAYS; }

function totalBays(b) {
  const L = b.length;
  if (L % 12 === 0 && L % 10 === 0) return L / b.poleSpacing;
  if (L % 8 === 0)  return L / 8;   // this branch was missing; must come before 12/10
  if (L % 12 === 0) return L / 12;
  if (L % 10 === 0) return L / 10;
  return L / b.poleSpacing;
}
function interiorBays(b) {
  if (b.length === 20 || b.length === 24) return 0;
  return totalBays(b) - EXTERIOR_BAYS;
}
// Confirmed against FileMaker: boards-per-width x interior bays (never below 0).
function boardsForInteriorBays(b) { return Math.max(0, roofBoardsPerWidth(b) * interiorBays(b)); }

function dripEdgeAmt(b) {
  if (b.roofType === "OpenRoof") return Math.ceil((b.length + 3) / 9.5) * 2;
  if (b.roofType === "LeanTo")   return Math.ceil((b.length + 3) / 9.5);
  return 0;
}

function fasciaBoardLengthPerSection(b) {
  if (b.roofType === "OpenRoof") return (b.width / 2) + 4;
  if (b.roofType === "LeanTo")   return b.width + 4;
  return 0;
}
// Returns 10, 12, or 14 — which SYP board length the fascia lumber uses.
function fasciaBoardSize(b) {
  const s = fasciaBoardLengthPerSection(b);
  if (s > 0  && s <= 10) return 10;
  if (s >= 11 && s <= 12) return 12;
  if (s >= 13 && s <= 14) return 14;
  if (s >= 15 && s <= 20) return 10;
  if (s >= 21 && s <= 24) return 12;
  if (s >= 25 && s <= 28) return 14;
  if (s >= 29 && s <= 30) return 10;
  if (s >= 31 && s <= 36) return 12;
  if (s >= 37 && s <= 40) return 10;
  if (s >= 41 && s <= 42) return 14;
  if (s >= 43 && s <= 48) return 12;
  if (s >= 49 && s <= 50) return 10;
  if (s >= 51 && s <= 56) return 14;
  if (s >= 57 && s <= 60) return 12;
  if (s >= 61 && s <= 70) return 14;
  return 0;
}
// The "range bucket" (10..70) that fascia length falls into — drives the count.
function fasciaBoardRanges(b) {
  const s = fasciaBoardLengthPerSection(b);
  if (s > 0  && s <= 10) return 10;
  if (s >= 11 && s <= 12) return 12;
  if (s >= 13 && s <= 14) return 14;
  if (s >= 15 && s <= 20) return 20;
  if (s >= 21 && s <= 24) return 24;
  if (s >= 25 && s <= 28) return 28;
  if (s >= 29 && s <= 30) return 30;
  if (s >= 31 && s <= 36) return 36;
  if (s >= 37 && s <= 40) return 40;
  if (s >= 41 && s <= 42) return 42;
  if (s >= 43 && s <= 48) return 48;
  if (s >= 49 && s <= 50) return 50;
  if (s >= 51 && s <= 56) return 56;
  if (s >= 57 && s <= 60) return 60;
  if (s >= 61 && s <= 70) return 70;
  return 0;
}
// Fascia board count (from FileMaker FasciaBoardAmt): range / board-length x 4.
function fasciaBoardAmt(b) {
  const r = fasciaBoardRanges(b);
  const mult = b.roofType === "LeanTo" ? 2 : 4; // lean-to has half the fascia sections
  if (r % 10 === 0) return (r / 10) * mult;
  if (r % 12 === 0) return (r / 12) * mult;
  if (r % 14 === 0) return (r / 14) * mult;
  return 0;
}

function gableRakeAmt(b) {
  if (b.roofType === "OpenRoof") return Math.ceil(((b.width / 2) + 2) / 9.5) * 4;
  if (b.roofType === "LeanTo")   return Math.ceil(((b.width / 2) + 2) / 9.5) * 2;
  return 0;
}
function fasciaTrimAmt(b) { return gableRakeAmt(b) + dripEdgeAmt(b); }

function metalPanelLength(b) {
  const overhang = 22 / 12; // NOTE: fixed roof pitch (4/12 open, 2/12 lean).
  if (b.roofType === "OpenRoof") {
    const run = b.width / 2 + overhang, rise = run * (4 / 12);
    return Math.ceil(Math.sqrt(run * run + rise * rise));
  }
  if (b.roofType === "LeanTo") {
    const run = b.width + overhang, rise = run * (2 / 12);
    return Math.ceil(Math.sqrt(run * run + rise * rise));
  }
  return 0;
}
function metalPanelAmt(b) {
  if (b.roofType === "OpenRoof") return Math.ceil((b.length + 3) / 3) * 2;
  if (b.roofType === "LeanTo")   return Math.ceil((b.length + 3) / 3);
  return 0;
}
function metalPanelScrewAmt(b) {
  // Exact live formulas: Open ((width+8)/2)*5*panels; Lean-To ((width+4)/2)*5*panels.
  // (Open equals the earlier (width/2)*5+20 form; Lean-To is now corrected.)
  if (b.roofType === "OpenRoof") return (((b.width + 8) / 2) * 5) * metalPanelAmt(b);
  if (b.roofType === "LeanTo")   return (((b.width + 4) / 2) * 5) * metalPanelAmt(b);
  return 0;
}
function perimeterTrimScrewAmt(b) {
  if (b.roofType === "OpenRoof") return (b.width * 2) + (b.length * 2);
  if (b.roofType === "LeanTo")   return (b.width * 2) + b.length;
  return 0;
}
function rebarAmt(b)        { return 2 * postAmt(b); }
function carriageBoltAmt(b) { return 4 * trussAmt(b); } // = 2*postAmt on open roofs; correct for lean-to too
function ribAmt(b) {
  if (b.roofType === "OpenRoof") return ((b.length + 3) / 0.75) * 2;
  if (b.roofType === "LeanTo")   return (b.length + 3) / 0.75;
  return 0;
}
function ridgeCapAmt(b)       { return Math.ceil((b.length + 3) / 9.5); }
function ridgeCapScrewAmt(b)  { return Math.ceil(ribAmt(b)); }
function trussAmt(b)          { return (b.length / b.poleSpacing) + 1; }
function trussBucketScrewAmt(b) {
  if (b.roofType === "OpenRoof") return ((b.width / 2) + 4) * 4 * trussAmt(b);
  if (b.roofType === "LeanTo")   return ((b.width / 2) + 2) * 4 * trussAmt(b);
  return 0;
}
function trussPricePerFoot(b, p) {
  const w = b.width;
  if (b.roofType === "OpenRoof") {
    if (w > 0  && w <= 45) return p.truss_open_0_45;
    if (w >= 46 && w <= 55) return p.truss_open_46_55;
    if (w >= 56 && w <= 60) return p.truss_open_56_60;
    if (w >= 61 && w <= 65) return p.truss_open_61_65;
  } else if (b.roofType === "LeanTo") {
    if (w > 0  && w <= 20) return p.truss_leanto_0_20;
    if (w >= 21 && w <= 30) return p.truss_leanto_21_30;
  }
  return 0;
}

/* ---- Concrete (Install jobs only) --------------------------------------
   Two FileMaker lookup functions plus the bag-vs-ready-mix branching from
   your scripts. The yardage table was machine-parsed from your functions
   doc. Note: the table only has even post counts; an odd PostAmt (possible
   on some lean-tos) finds no match and yields 0 yards, mirroring FileMaker. */
const CONCRETE_YARDAGE_RULES = [[0,8,4],[1,10,4],[1,12,5],[1,14,6],[1,16,7],[1,18,7],[1,20,8],[1,22,9],[1,24,10],[1,26,10],[1,28,11],[1,30,12],[1,32,13],[1,34,13],[1,36,14],[1,38,15],[1,40,16],[1,42,16],[1,44,17],[1,46,18],[1,48,19],[1,50,19],[1,52,20],[1,54,21],[1,56,22],[1,58,23],[1,60,23],[1,62,24],[2,6,4],[3,8,5],[3,10,6],[3,12,7],[3,14,8],[3,16,9],[3,18,10],[3,20,11],[3,22,11],[3,24,12],[3,26,13],[3,28,14],[3,30,15],[3,32,16],[3,34,17],[3,36,18],[3,38,19],[3,40,20],[3,42,21],[3,44,22],[3,46,23],[3,48,24],[3,50,25],[3,52,26],[3,54,27],[3,56,28],[3,58,29],[3,60,30],[3,62,31],[4,6,4],[5,8,5],[5,10,6],[5,12,7],[5,14,8],[5,16,9],[5,18,10],[5,20,11],[5,22,12],[5,24,13],[5,26,14],[5,28,15],[5,30,16],[5,32,17],[5,34,18],[5,36,19],[5,38,21],[5,40,21],[5,42,23],[5,44,24],[5,46,25],[5,48,26],[5,50,27],[5,52,28],[5,54,29],[5,56,30],[5,58,31],[5,60,32],[5,62,33],[6,6,4],[6,8,5],[6,10,7],[6,12,8],[6,14,9],[6,16,10],[6,18,12],[6,20,13],[6,22,14],[6,24,15],[6,26,17],[6,28,18],[6,30,19],[6,32,20],[6,34,22],[6,36,23],[6,38,24],[6,40,25],[6,42,27],[6,44,28],[6,46,29],[6,48,30],[6,50,32],[6,52,33],[6,54,34],[6,56,35],[6,58,36],[6,60,38],[6,62,39]];
// Exact translation of the FileMaker ConcreteYardagePerPost Case — evaluated in
// order, first match wins. It reproduces FileMaker's operator precedence
// (`and` binds tighter than `or`), so the unparenthesized width<=18 rows can
// return a 6x6 value for any post size, and the unguarded even-PostAmt rows in
// the 8x8 block can apply to 10x10 — quirks that the live output depends on.
// kinds: 0 = w<=18 && p==E && 6x6            (le18, p=8 only)
//        1 = (w<=18 && p==E) || (p==E-1 && 6x6)      (le18)
//        2 = w>=20 && p==E && 6x6            (ge20, p=6 only)
//        3 = w>=20 && (p==E||p==E-1) && 6x6  (ge20)
//        4 = p==E && 8x8                     (8x8, p=6 only)
//        5 = (p==E) || (p==E-1 && 8x8)       (8x8)
//        6 = p==E && 10x10                   (10x10)
function concreteYardagePerPost(b) {
  const w = b.width, p = postAmt(b), s = b.postSize;
  for (let i = 0; i < CONCRETE_YARDAGE_RULES.length; i++) {
    const r = CONCRETE_YARDAGE_RULES[i], k = r[0], E = r[1];
    let m = false;
    if (k === 0) m = w <= 18 && p === E && s === "6x6";
    else if (k === 1) m = (w <= 18 && p === E) || (p === E - 1 && s === "6x6");
    else if (k === 2) m = w >= 20 && p === E && s === "6x6";
    else if (k === 3) m = w >= 20 && (p === E || p === E - 1) && s === "6x6";
    else if (k === 4) m = p === E && s === "8x8";
    else if (k === 5) m = (p === E) || (p === E - 1 && s === "8x8");
    else if (k === 6) m = p === E && s === "10x10";
    if (m) return r[2];
  }
  return 0;
}
// Number of concrete bags — exact ordered port of the FileMaker ConcreteBagsTotal
// Case (first match wins). Bags-only jobs use 18/post (6x6 narrow, small 8x8) or
// 23/post (6x6 wide); everything else is 1/post. Note the live function omits
// lean-to Premium 6x6 at width>=20 from the x23 group, so it falls to 1/post —
// preserved here. (The "Each End Closed" option branch lives in the closure code.)
function concreteBagsTotal(b) {
  const amt = postAmt(b), rt = b.roofType, ps = b.postSize, w = b.width, m = b.model;
  if (rt === "LeanTo"   && ps === "8x8"   && amt <= 5 && m === "Premium") return amt * 18;
  if (rt === "OpenRoof" && ps === "8x8"   && amt <= 5 && m === "Premium") return amt * 1;
  if (rt === "OpenRoof" && ps === "10x10" && amt <= 5 && m === "Premium") return amt * 1;
  if (w <= 18 && rt === "OpenRoof" && ps === "6x6" && amt <= 7 && m === "Premium") return amt * 18;
  if (w <= 18 && rt === "LeanTo"   && ps === "6x6" && amt <= 7 && m === "Base")    return amt * 18;
  if (w <= 18 && rt === "OpenRoof" && ps === "6x6" && amt <= 7 && m === "Base")    return amt * 18;
  if (w <= 18 && rt === "LeanTo"   && ps === "6x6" && amt <= 7 && m === "Regular") return amt * 18;
  if (w <= 18 && rt === "LeanTo"   && ps === "6x6" && amt <= 7 && m === "Premium") return amt * 18;
  if (w <= 18 && rt === "OpenRoof" && ps === "6x6" && amt <= 7 && m === "Regular") return amt * 18;
  if (w >= 20 && rt === "OpenRoof" && ps === "6x6" && amt <  6 && m === "Premium") return amt * 23;
  if (w >= 20 && rt === "LeanTo"   && ps === "6x6" && amt <  6 && m === "Base")    return amt * 23;
  if (w >= 20 && rt === "OpenRoof" && ps === "6x6" && amt <  6 && m === "Base")    return amt * 23;
  if (w >= 20 && rt === "LeanTo"   && ps === "6x6" && amt <  6 && m === "Regular") return amt * 23;
  if (w >= 20 && rt === "OpenRoof" && ps === "6x6" && amt <  6 && m === "Regular") return amt * 23;
  if (rt === "LeanTo"   && ps === "8x8" && amt <= 5 && m === "Base")    return amt * 18;
  if (rt === "OpenRoof" && ps === "8x8" && amt <= 5 && m === "Base")    return amt * 18;
  if (rt === "LeanTo"   && ps === "8x8" && amt <= 5 && m === "Regular") return amt * 18;
  if (rt === "OpenRoof" && ps === "8x8" && amt <= 5 && m === "Regular") return amt * 18;
  return amt * 1;
}
// Returns { yards, bags, truck } for the install scenario. (Kit jobs simply
// don't call this.)
function concreteCost(b) {
  const amt = postAmt(b), bags = concreteBagsTotal(b);
  // Bag-only vs ready-mix + bags, per your script thresholds.
  let readyMix;
  if (b.postSize === "10x10") readyMix = true;
  else if (b.postSize === "8x8") readyMix = amt >= 6;
  else /* 6x6 */ readyMix = !((b.width <= 18 && amt <= 7) || (b.width >= 20 && amt < 6));
  return { yards: readyMix ? concreteYardagePerPost(b) : 0, bags, truck: readyMix };
}

/* ==========================================================================
   5. BUILD COMPONENTS — assembles the full line-item list.
   ==========================================================================
   Each item: { name, quantity, length, unitPrice }.  total = qty x len x price */
function buildComponents(b, prices) {
  const items = [];
  const model = MODELS[b.model];
  const fin = b.finish === "Colored" ? "colored" : "galv";

  // ---- Posts ----
  items.push({ name: b.postSize + " Posts", quantity: postAmt(b), length: 1,
               ref: "post_" + b.postSize, unitPrice: prices["post_" + b.postSize] });

  // ---- SYP lumber: accumulate into 10 / 12 / 14 ft buckets, then emit ----
  const boards = { 10: 0, 12: 0, 14: 0 };

  // (a) Boards for bays — exterior always; interior only if there are any.
  if (b.poleSpacing === 10) {
    boards[12] += boardsForExteriorBays(b);
    if (interiorBays(b) !== 0) boards[10] += boardsForInteriorBays(b);
  } else if (b.poleSpacing === 12) {
    boards[14] += boardsForExteriorBays(b);
    if (interiorBays(b) !== 0) boards[12] += boardsForInteriorBays(b);
  }
  // (b) Post bracing — always to 2x6x14.
  boards[14] += 2 * postAmt(b);
  // (c) Fascia boards — Regular & Premium only (qty is GAP #2, currently 0).
  if (model.trim.includes("fasciaBoards")) {
    const fs = fasciaBoardSize(b);
    if (boards[fs] !== undefined) boards[fs] += fasciaBoardAmt(b);
  }
  // (d) Waste — 3% of all boards, rounded up, to the 14 bucket (else 12).
  const totalBoards = boards[10] + boards[12] + boards[14];
  const waste = Math.ceil(totalBoards * 0.03);
  if (boards[14] > 0) boards[14] += waste; else boards[12] += waste;

  for (const size of [10, 12, 14]) {
    if (boards[size] > 0)
      items.push({ name: "2x6x" + size + " SYP #2", quantity: boards[size], length: 1,
                   ref: "syp_2x6x" + size, unitPrice: prices["syp_2x6x" + size] });
  }

  // ---- Trusses ----
  items.push({ name: "Trusses", quantity: trussAmt(b), length: 1,
               unitPrice: trussPricePerFoot(b, prices) * b.width });

  // ---- Rebar & carriage bolts ----
  items.push({ name: "Rebar (18in)", quantity: rebarAmt(b), length: 1,
               ref: "rebar_18in", unitPrice: prices.rebar_18in });
  items.push({ name: "Carriage Bolts (10in)", quantity: carriageBoltAmt(b), length: 1,
               ref: "carriage_bolt_" + b.postSize, unitPrice: prices["carriage_bolt_" + b.postSize] });

  // ---- Metal panels (gauge + finish) ----
  const panelKey = (b.gauge === "29" ? "metal_29ga_" : "metal_26ga_") + fin;
  items.push({ name: "Metal Panels (" + b.gauge + "ga)", quantity: metalPanelAmt(b),
               length: metalPanelLength(b), ref: panelKey, unitPrice: prices[panelKey] });

  // ---- Metal trim (which pieces depend on the model) ----
  if (model.trim.includes("ridgeCap"))
    items.push({ name: "Ridge Cap", quantity: ridgeCapAmt(b), length: 1,
                 ref: "ridge_cap_" + fin, unitPrice: prices["ridge_cap_" + fin] });

  if (model.trim.includes("gableRake")) {
    const rakeKey = (b.model === "Premium" ? "gable_rake_" : "gable_rake_barn_") + fin;
    items.push({ name: "Gable Rake", quantity: gableRakeAmt(b), length: 1,
                 ref: rakeKey, unitPrice: prices[rakeKey] });
  }
  if (model.trim.includes("dripEdge"))
    items.push({ name: "Drip Edge", quantity: dripEdgeAmt(b), length: 1,
                 ref: "drip_edge_" + fin, unitPrice: prices["drip_edge_" + fin] });

  if (model.trim.includes("fasciaTrim")) {
    const qty = model.fasciaTrimQtyFrom === "fasciaTrim" ? fasciaTrimAmt(b) : dripEdgeAmt(b);
    items.push({ name: "Fascia Trim", quantity: qty, length: 1,
                 ref: "fascia_trim_" + fin, unitPrice: prices["fascia_trim_" + fin] });
  }

  // ---- Screws: sum every screw type, then package into 250-count bags ----
  const totalScrews = trussBucketScrewAmt(b)
                    + Math.round(ridgeCapScrewAmt(b))
                    + perimeterTrimScrewAmt(b)
                    + metalPanelScrewAmt(b);
  const screwBags = Math.ceil(totalScrews / 250);
  items.push({ name: "Wood Grip Screws (1.5in)", quantity: screwBags, length: 1,
               ref: "wood_screw_bag", unitPrice: prices.wood_screw_bag });

  return items;
}

// Install charge (from FileMaker PoleBarnInstallCharge): a per-tier/post-size
// rate on floor area, with a floor of install_floor. (Only used for the
// install price.)
function installChargeAmt(b, prices) {
  const area = b.length * b.width;
  let rate = prices.install_rate_default;
  if (b.model === "Base")
    rate = b.postSize === "6x6" ? prices.install_rate_base_6x6
         : b.postSize === "8x8" ? prices.install_rate_base_8x8 : prices.install_rate_default;
  else if (b.model === "Regular")
    rate = b.postSize === "6x6" ? prices.install_rate_regular_6x6
         : b.postSize === "8x8" ? prices.install_rate_regular_8x8 : prices.install_rate_default;
  else if (b.model === "Premium")
    rate = b.postSize === "6x6" ? prices.install_rate_premium_6x6 : prices.install_rate_default;
  return Math.max(prices.install_floor, area * rate);
}

// Total concrete cost for the job (ready-mix + truck + bags).
function concreteTotal(b, prices) {
  const c = concreteCost(b);
  return c.yards * prices.concrete_yard + (c.truck ? prices.concrete_truck : 0)
       + c.bags * prices.concrete_bag;
}

/* Install job costs: concrete + install charge + blueprints + metal delivery.
   (Confirmed against your FileMaker $total Sum. The Kit price is derived from
   the Standard price rather than rebuilt — see render.) */
function buildJobCosts(b, prices) {
  const items = [];
  const concrete = concreteCost(b);
  if (concrete.yards > 0)
    items.push({ name: "Concrete (ready-mix)", quantity: concrete.yards, length: 1, ref: "concrete_yard", unitPrice: prices.concrete_yard });
  if (concrete.truck)
    items.push({ name: "Concrete Truck", quantity: 1, length: 1, ref: "concrete_truck", unitPrice: prices.concrete_truck });
  if (concrete.bags > 0)
    items.push({ name: "Concrete Bags", quantity: concrete.bags, length: 1, ref: "concrete_bag", unitPrice: prices.concrete_bag });
  const install = installChargeAmt(b, prices);
  if (install > 0)
    items.push({ name: "Install Charge", quantity: 1, length: 1, unitPrice: install });
  items.push({ name: "Blueprints", quantity: 1, length: 1, ref: "blueprints", unitPrice: prices.blueprints });
  items.push({ name: "Metal Delivery", quantity: 1, length: 1, ref: "metal_delivery", unitPrice: prices.metal_delivery });
  return items;
}

/* ==========================================================================
   5b. CLOSURE / ENCLOSURE OPTIONS
   ==========================================================================
   Verified against the "Both Sides Closed" Price Detail screen.
   c = { option, length, height, poleSpacing, width }
   Pricing: Kit = Ceiling(components); Install (Standard) = Kit + labor charge. */
const CLOSURE_SYP_PER_SIDE = { 8: 4, 10: 6, 12: 7, 14: 9, 16: 10, 18: 12 };

function closureComponents(c, prices) {
  if (c.option === "Each End Closed")    return closureEachEndComponents(c, prices);
  if (c.option === "Gable End Closed")   return closureGableEndComponents(c, prices);
  if (c.option === "4' Drop Panel")      return closureDropPanelComponents(c, prices);
  if (c.option === "Wainscot Sidewall")  return closureWainscotComponents(c, prices, "side");
  if (c.option === "Wainscot Endwall")   return closureWainscotComponents(c, prices, "end");
  const items = [];
  const sideCount = c.option === "Both Sides Closed" ? 2 : 1;
  const bays = totalBays({ length: c.length, poleSpacing: c.poleSpacing });
  const sypPerSide = CLOSURE_SYP_PER_SIDE[c.height] || 0;

  // SYP + PT girt boards, placed by pole spacing, then 10% waste added.
  const syp = { 10: 0, 12: 0, 14: 0 }, pt = { 10: 0, 12: 0, 14: 0 };
  const sz = c.poleSpacing === 10 ? 10 : 12;
  syp[sz] = sideCount * sypPerSide * bays;
  pt[sz]  = sideCount * 2 * bays;
  const addWaste = (o) => {
    const w = Math.ceil((o[10] + o[12] + o[14]) * 0.1);
    if (o[14] > 0) o[14] += w; else if (o[12] > 0) o[12] += w; else if (o[10] > 0) o[10] += w;
  };
  addWaste(syp); addWaste(pt);
  for (const s of [10, 12, 14]) if (syp[s] > 0) items.push({ name: "SYP 2x6x" + s, quantity: syp[s], length: 1, ref: "syp_2x6x" + s, unitPrice: prices["syp_2x6x" + s] });
  for (const s of [10, 12, 14]) if (pt[s]  > 0) items.push({ name: "PT 2x6x" + s,  quantity: pt[s],  length: 1, ref: "pt_2x6x" + s, unitPrice: prices["pt_2x6x" + s] });

  // Wall panels (26 ga colored); panel length = wall height.
  const panelQty = Math.ceil(c.length / 3) * sideCount;
  items.push({ name: "26 Ga. Panel", quantity: panelQty, length: c.height, ref: "metal_26ga_colored", unitPrice: prices.metal_26ga_colored });

  // Z-flashing + J-channel run the length, per side.
  const perimeter = Math.ceil(c.length / 9.5) * sideCount;
  items.push({ name: "Z Flashing", quantity: perimeter, length: 1, ref: "zflashing_colored", unitPrice: prices.zflashing_colored });
  items.push({ name: "J Channel",  quantity: perimeter, length: 1, ref: "jchannel_colored", unitPrice: prices.jchannel_colored });

  // Wood grip screws, bagged per 250.
  const panelScrew = ((((c.height / 2) - 2) * 5) + 20) * panelQty;
  items.push({ name: "Wood Grip Screws (1.5in)", quantity: Math.ceil(panelScrew / 250), length: 1, ref: "wood_screw_bag", unitPrice: prices.wood_screw_bag });

  // Deck screws: under 772 screws bills as half a box shown but a full box charged.
  const allBoards = syp[10] + syp[12] + syp[14] + pt[10] + pt[12] + pt[14];
  const box = allBoards < 772 ? 0.5 : Math.ceil(allBoards / 1543);
  items.push({ name: "3in Deck Screw Box", quantity: box, length: 1, ref: "deck_screw_3in_box", unitPrice: prices.deck_screw_3in_box,
               total: (box === 0.5 ? 1 : box) * prices.deck_screw_3in_box });

  // Outside corner trim.
  const corner = c.height === 8 ? 2 * sideCount
               : Math.ceil((c.height / 9.5) * (sideCount === 2 ? 5 : 3));
  items.push({ name: "Outside Corner Trim", quantity: corner, length: 1, ref: "outside_corner_trim_colored", unitPrice: prices.outside_corner_trim_colored });

  items.push({ name: "Blueprints", quantity: 1, length: 1, ref: "blueprints_option", unitPrice: prices.blueprints_option });
  return items;
}

function closureLabor(c, prices) {
  const area = c.length * c.height;
  const rate = prices.closure_labor_rate, floor = prices.closure_labor_floor;
  if (c.option === "Both Sides Closed") return Math.max(floor, area * rate * 2);
  if (c.option === "One Side Closed")   return Math.max(floor, area * rate);
  if (c.option === "Each End Closed")   return c.width * (c.height + 6) * rate; // width*(H+6)*rate
  if (c.option === "Gable End Closed")  return Math.max(prices.closure_gable_floor, c.width * 6 * prices.closure_gable_rate);
  if (c.option === "4' Drop Panel")     return c.length * 4 * rate;
  if (c.option === "Wainscot Sidewall") return c.length * 4 * rate;
  if (c.option === "Wainscot Endwall")  return c.width * 4 * rate;
  return 0;
}

// Stepped end-wall panel heights that follow the 4:12 gable line (from the
// "Each End Closure Panel Heights" script). Symmetric: rises to the peak, then
// falls. Each End starts at wall height + 2; Gable End starts at 3 (triangle
// only). Ready to drive the Each End / Gable End Closed panel + screw totals
// once those options are wired in and validated.
function endWallPanelHeights(option, width, height) {
  const panelQty = Math.ceil((width + 1) / 3);
  let start;
  if (option === "Each End Closed") start = height + 2;
  else if (option === "Gable End Closed") start = 3;
  else return [];
  const list = [];
  const K = Math.ceil(panelQty / 2);
  for (let i = 0; i < K; i++) list.unshift(start + i);   // ascending, prepended
  let remaining = panelQty - K, lastSize = list[0];
  while (remaining > 0) {
    if (!(panelQty % 2 === 0 && panelQty / 2 === remaining)) lastSize -= 1;
    list.unshift(lastSize);
    remaining -= 1;
  }
  return list;
}

// End-wall interior post count + framing-board length (from $listPostBoard):
// pick whichever board length spans the width in fewer pieces; posts = that
// count minus one.
function closureListPostBoard(width) {
  const ten    = width % 10 === 0 ? width / 10 : Math.ceil(width / 10);
  const twelve = width % 12 === 0 ? width / 12 : Math.ceil(width / 12);
  let count, size;
  if (ten < twelve) { count = ten; size = 10; }
  else if (twelve < ten) { count = twelve; size = 12; }
  else { count = ten; size = 10; }
  return { postAmt: count - 1, boardSize: size };
}

// Gable peak rise for a pitch like "4:12": ceil(((width/2 + 2) / run) * rise).
function gableEndRise(width, pitch) {
  const rise = parseInt(pitch.slice(0, 1), 10);
  const run  = parseInt(pitch.slice(-2), 10);
  return Math.ceil((((width / 2) + 2) / run) * rise);
}

/* Each End Closed — a single gable end. Uses width + height (not length or
   pole spacing). Panels are stepped (variable heights), plus end-wall framing,
   interior posts + post-hole concrete, gable boards, trim, and screws.
   Component set matches the Each End $total Sum (posts and concrete summed;
   Simpson buckets shown in FileMaker but not summed). */
function closureEachEndComponents(c, prices) {
  const items = [];
  const w = c.width, h = c.height;
  const heights = endWallPanelHeights("Each End Closed", w, h);
  const { postAmt, boardSize } = closureListPostBoard(w);
  const panelQty = Math.ceil((w + 1) / 3);

  // End-wall framing boards, then 10% waste (stage 1, before gable boards).
  const syp = { 10: 0, 12: 0, 14: 0 }, pt = { 10: 0, 12: 0, 14: 0 };
  const bays = w === 12 ? 1 : postAmt + 1;
  syp[boardSize] = (CLOSURE_SYP_PER_SIDE[h] || 0) * bays;
  pt[boardSize]  = 2 * bays;
  const wasteInto = (o, skip10) => {
    const wst = Math.ceil((o[10] + o[12] + o[14]) * 0.1);
    if (o[14] > 0) o[14] += wst;
    else if (o[12] > 0) o[12] += wst;
    else if (o[10] > 0 && !skip10) o[10] += wst;
  };
  wasteInto(syp, true);   // Each End SYP first pass skips a 10-ft-only pile (FileMaker quirk)
  wasteInto(pt, false);

  // Gable boards into 2x6x14, then waste again (stage 2).
  const rise = gableEndRise(w, "4:12");
  const gableBoards = (Math.ceil((w + 2) / 14) * Math.ceil(rise / 2 + 2)) + Math.ceil(w / 8);
  syp[14] += gableBoards;
  wasteInto(syp, false);

  for (const s of [10, 12, 14]) if (syp[s] > 0) items.push({ name: "SYP 2x6x" + s, quantity: syp[s], length: 1, ref: "syp_2x6x" + s, unitPrice: prices["syp_2x6x" + s] });
  for (const s of [10, 12, 14]) if (pt[s]  > 0) items.push({ name: "PT 2x6x" + s,  quantity: pt[s],  length: 1, ref: "pt_2x6x" + s, unitPrice: prices["pt_2x6x" + s] });

  if (postAmt > 0) {
    items.push({ name: "6x6x20 Posts", quantity: postAmt, length: 1, ref: "post_6x6x20", unitPrice: prices.post_6x6x20 });
    items.push({ name: "Concrete Bags", quantity: postAmt * 12, length: 1, ref: "concrete_bag", unitPrice: prices.concrete_bag });
  }

  // Stepped wall panels: total = sum(panel heights) x price (each panel's ft = its height).
  const sumHeights = heights.reduce((a, b) => a + b, 0);
  items.push({ name: "26 Ga. Panel (\u00d7" + panelQty + " stepped)", quantity: 1, length: sumHeights, ref: "metal_26ga_colored", unitPrice: prices.metal_26ga_colored });

  items.push({ name: "Z Flashing", quantity: Math.ceil((w + 1) / 9.5), length: 1, ref: "zflashing_colored", unitPrice: prices.zflashing_colored });
  items.push({ name: "J Channel",  quantity: Math.ceil((((w + 2) / 2) / 9.5) * 2), length: 1, ref: "jchannel_colored", unitPrice: prices.jchannel_colored });

  // Wood grip screws sized per stepped panel.
  const screwSum = heights.reduce((a, ph) => a + Math.ceil(((((ph / 2) - 2) * 5) + 20)), 0);
  items.push({ name: "Wood Grip Screws (1.5in)", quantity: Math.ceil(screwSum / 250), length: 1, ref: "wood_screw_bag", unitPrice: prices.wood_screw_bag });

  const allBoards = syp[10] + syp[12] + syp[14] + pt[10] + pt[12] + pt[14];
  const box = allBoards < 772 ? 0.5 : Math.ceil(allBoards / 1543);
  items.push({ name: "3in Deck Screw Box", quantity: box, length: 1, ref: "deck_screw_3in_box", unitPrice: prices.deck_screw_3in_box, total: (box === 0.5 ? 1 : box) * prices.deck_screw_3in_box });

  items.push({ name: "Outside Corner Trim", quantity: Math.ceil(((h + 1) / 9.5) * 2), length: 1, ref: "outside_corner_trim_colored", unitPrice: prices.outside_corner_trim_colored });
  items.push({ name: "Blueprints", quantity: 1, length: 1, ref: "blueprints_option", unitPrice: prices.blueprints_option });
  return items;
}

/* Gable End Closed — the triangular gable only (uses width). Stepped panels
   from height 3, gable boards, J-channel, screws, deck screws, blueprints.
   No Z-flashing, corner trim, posts, or concrete. */
function closureGableEndComponents(c, prices) {
  const items = [];

/* 4' Drop Panel — a 4-ft skirt down a sidewall (uses length + pole spacing).

/* Wainscot — a lower metal band. Per your script's $total, only Z-flashing +

function barnPullComponents(b, prices){

function priceBarn(b, prices){
  const standard = Math.ceil(compSum(buildComponents(b,prices)) + compSum(buildJobCosts(b,prices)));
  const install  = standard + prices.delivery_install;
  const kit = Math.ceil(standard - rebarAmt(b)*prices.rebar_18in - concreteTotal(b,prices) - installChargeAmt(b,prices) + prices.delivery_kit);
  return {
    standard, install, kit,
    z1i: zoneP(install, prices.zone_1_margin), z1k: zoneP(kit, prices.zone_1_margin),
    z2i: zoneP(install, prices.zone_2_margin), z2k: zoneP(kit, prices.zone_2_margin),

  const concrete = items.filter(it => it.name === "Concrete Bags").reduce((s,it)=> s + it.quantity*it.length*it.unitPrice, 0);
  const install = Math.ceil(compSum(items) + labor);
  const kit = Math.ceil(install - labor - concrete);
  return {
    standard: install, install, kit, labor,
    z1i: zoneP(install, prices.zone_1_margin), z1k: zoneP(kit, prices.zone_1_margin),
    z2i: zoneP(install, prices.zone_2_margin), z2k: zoneP(kit, prices.zone_2_margin),

function categorize(name){
  const n = name.toLowerCase();
  if (n.includes("post")) return "Posts";
  if (n.includes("truss")) return "Trusses";
  if (n.includes("2x6") || n.includes("2x4") || n.includes("board") || n.includes("syp") || n.startsWith("pt ")) return "Lumber";
  if (n.includes("panel")||n.includes("ridge")||n.includes("gable")||n.includes("drip")||n.includes("fascia")||n.includes("flashing")||n.includes("channel")||n.includes("corner")||n.includes("transition")||n.includes("trim")) return "Metal & Trim";
  if (n.includes("screw")||n.includes("bolt")||n.includes("rebar")) return "Hardware";
  if (n.includes("concrete")) return "Concrete";
  return "Other";
}

    case "Each End Closed":   return "Each End Closed " + H + " " + W;
    case "Gable End Closed":  return "Gable End Closed " + W;
    case "4' Drop Panel":     return "4' Drop Panel " + L;
    case "Wainscot Sidewall": return "Wainscot Sidewall " + L;
    case "Wainscot Endwall":  return "Wainscot Endwall " + W;
    default: return c.option;
  }
}
// Which config fields each closure option actually uses (others are hidden).
const CLOSURE_FIELDS = {
  "Both Sides Closed": ["height","length","poleSpacing"],
  "Each End Closed":   ["height","width"],
  "Gable End Closed":  ["height","width"],
  "4' Drop Panel":     ["length","poleSpacing"],
  "Wainscot Sidewall": ["length"],
  "Wainscot Endwall":  ["width"],
};
function autoSpacing(len){ if (!(len > 0)) return null; if (len % 12 === 0) return 12; if (len % 10 === 0) return 10; return null; }


// ---- Standard product catalog (generated from the price-sheet size grids) ----
// Open Roof widths 12-60; Lean-To widths 6-30; lengths per the sheets. Standard
// post per model (Premium 8x8, else 6x6) and 29 ga Galvalume. Computed on demand.
function standardPost(model){ return model === "Premium" ? "8x8" : "6x6"; }
const OPEN_WIDTHS = (function(){ const a=[]; for(let w=12; w<=60; w+=2) a.push(w); return a; })();
const LEAN_WIDTHS = (function(){ const a=[]; for(let w=6; w<=30; w+=2) a.push(w); return a; })();
const OPEN_LENGTHS = [20,24,30,36,40,48,50,60];
const LEAN_LENGTHS = [10,12,20,24,30,36,40,48,50,60];
function buildCatalog(){
  const out = [];
  for (const model of ["Premium","Regular","Base"]){
    for (const roofType of ["OpenRoof","LeanTo"]){
      const widths  = roofType === "OpenRoof" ? OPEN_WIDTHS : LEAN_WIDTHS;
      const lengths = roofType === "OpenRoof" ? OPEN_LENGTHS : LEAN_LENGTHS;
      for (const width of widths){
        for (const length of lengths){
          const config = { model, roofType, width, length, poleSpacing: autoSpacing(length) || 10, postSize: standardPost(model), gauge: "29", finish: "Galvalume" };
          out.push({ kind: "barn", description: describeProduct("barn", config), config });
        }
      }
    }
  }
  return out;
}
const CATALOG = buildCatalog();

// expose to the (babel-compiled) React script
Object.assign(window, { sb, usd, sha256Hex, loadComponents, priceBarn, priceClosure, categorize, catFor, labelFor, CAT_ORDER, ACCESS_HASH, describeProduct, CLOSURE_FIELDS, autoSpacing, CATALOG });
</script>

<script type="text/babel">
const { useState, useEffect } = React;

function Header({ title, right }) {
  return (
    <header className="app-header p-3 mb-3 d-flex justify-content-between align-items-center">
      <div>
        <div className="eyebrow">Materials &amp; Costs</div>
        <h1 className="h4 fw-bold mb-0">{title}</h1>
      </div>
      <div>{right}</div>
    </header>
  );
}

function Login({ onReady }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function submit() {
    setBusy(true); setErr("");
    try {
      if ((await sha256Hex(pw)) !== ACCESS_HASH) { setErr("Incorrect password."); setBusy(false); return; }
      const { prices, meta } = await loadComponents();
      if (!prices || Object.keys(prices).length === 0) { setErr("No components found - run the components SQL in Supabase."); setBusy(false); return; }
      onReady({ prices, meta });
    } catch (e) { setErr("Couldn't load: " + e.message); setBusy(false); }
  }
  return (
    <div className="lockwrap">
      <div style={{ maxWidth: 360, width: "100%", textAlign: "center" }}>
        <img src="https://yourlegacybuilding.com/wp-content/uploads/2022/01/Legacy-Builders.svg" alt="Legacy Building" style={{ height: 56, marginBottom: 24 }} />

        <div style={{ color: "#aeb3b8", fontSize: ".85rem", margin: ".2rem 0 1.25rem" }}>Enter the access password to continue.</div>
        <input type="password" className="form-control mb-2" placeholder="Password" value={pw}
          onChange={e => setPw(e.target.value)} onKeyDown={e => { if (e.key === "Enter") submit(); }} />
        <button className="btn btn-brand w-100 py-2" disabled={busy} onClick={submit}>{busy ? "Loading…" : "Unlock"}</button>
        <div style={{ color: "#ffb4a2", fontSize: ".85rem", marginTop: ".75rem", minHeight: "1.2rem" }}>{err}</div>

}

function JobsList({ onOpen, onNew, onComponents, onProducts }) {

    if (error) setErr(error.message); else setJobs(data || []);

  useEffect(() => { load(); }, []);
  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Jobs" right={<div className="d-flex gap-2"><button className="btn btn-outline-light btn-sm" onClick={onProducts}>Products</button><button className="btn btn-outline-light btn-sm" onClick={onComponents}>Components</button><button className="btn btn-brand btn-sm" onClick={onNew}>+ New Job</button></div>} />
      {err && <div className="alert alert-warning">{err}</div>}
      {jobs === null ? <p className="text-muted">Loading…</p> :

          <ul className="list-group list-group-flush">
            {jobs.map(j => (
              <li key={j.id} className="list-group-item d-flex justify-content-between align-items-center" style={{ cursor: "pointer" }} onClick={() => onOpen(j.id)}>
                <span><b>{j.client_name}</b> <span className="text-muted">· Zone {j.zone}</span></span>

              </li>
            ))}
          </ul>

}

// Configure a barn/closure and compute it (no outer card; hosted by AddProduct).
function ProductConfig({ prices, onAdd, onCancel }) {
  const [kind, setKind] = useState("barn");
  const [b, setB] = useState({ model: "Premium", width: "", length: "", poleSpacing: 10, postSize: "8x8", roofType: "OpenRoof", gauge: "29", finish: "Galvalume" });
  const [c, setC] = useState({ option: "Both Sides Closed", width: "", length: "", poleSpacing: 10, height: 8 });
  const upB = (k, v) => setB(p => ({ ...p, [k]: v }));
  const upC = (k, v) => setC(p => ({ ...p, [k]: v }));
  const onLen = (setter) => (e) => { const v = e.target.value; const sp = autoSpacing(+v); setter(p => ({ ...p, length: v, ...(sp ? { poleSpacing: sp } : {}) })); };
  function add() {
    if (kind === "barn") {
      const barn = { ...b, width: +b.width, length: +b.length, poleSpacing: +b.poleSpacing };
      if (!(barn.width > 0 && barn.length > 0)) { alert("Enter width and length."); return; }
      const p = priceBarn(barn, prices);
      onAdd({ kind: "barn", label: describeProduct("barn", barn), config: barn, pricing: p, components: p.components });
    } else {
      const clo = { ...c, width: +c.width, length: +c.length, poleSpacing: +c.poleSpacing, height: +c.height };
      const p = priceClosure(clo, prices);
      onAdd({ kind: "closure", label: describeProduct("closure", clo), config: clo, pricing: p, components: p.components });
    }
  }
  const sel = (val, set, opts) => <select className="form-select" value={val} onChange={e => set(e.target.value)}>{opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>;
  const cf = CLOSURE_FIELDS[c.option] || [];
  return (
    <div>
      <div className="btn-group btn-group-sm mb-3">
        <button className={"btn btn-sm " + (kind === "barn" ? "btn-brand" : "btn-outline-secondary")} onClick={() => setKind("barn")}>Pole Barn</button>
        <button className={"btn btn-sm " + (kind === "closure" ? "btn-brand" : "btn-outline-secondary")} onClick={() => setKind("closure")}>Enclosure</button>
      </div>
      {kind === "barn" ? (
        <div className="row g-2">
          <div className="col-md-4"><label className="form-label small fw-semibold">Model</label>{sel(b.model, v => upB("model", v), [["Base","Base"],["Regular","Regular"],["Premium","Premium"]])}</div>
          <div className="col-md-4"><label className="form-label small fw-semibold">Roof</label>{sel(b.roofType, v => upB("roofType", v), [["OpenRoof","Open Roof"],["LeanTo","Lean-To"]])}</div>
          <div className="col-md-4"><label className="form-label small fw-semibold">Post</label>{sel(b.postSize, v => upB("postSize", v), [["6x6","6x6"],["8x8","8x8"],["10x10","10x10"]])}</div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Width</label><input className="form-control" type="number" value={b.width} onChange={e => upB("width", e.target.value)} /></div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Length</label><input className="form-control" type="number" value={b.length} onChange={onLen(setB)} /></div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Spacing</label>{sel(b.poleSpacing, v => upB("poleSpacing", v), [[10,"10 ft"],[12,"12 ft"]])}</div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Gauge</label>{sel(b.gauge, v => upB("gauge", v), [["29","29 ga"],["26","26 ga"]])}</div>
          <div className="col-md-6"><label className="form-label small fw-semibold">Finish</label>{sel(b.finish, v => upB("finish", v), [["Galvalume","Galvalume"],["Colored","Colored"]])}</div>
        </div>
      ) : (
        <div className="row g-2">
          <div className="col-md-6"><label className="form-label small fw-semibold">Option</label>{sel(c.option, v => upC("option", v), [["Both Sides Closed","Both Sides Closed"],["Each End Closed","Each End Closed"],["Gable End Closed","Gable End Closed"],["4' Drop Panel","4' Drop Panel"],["Wainscot Sidewall","Wainscot Sidewall"],["Wainscot Endwall","Wainscot Endwall"]])}</div>
          {cf.includes("height") && <div className="col-md-6"><label className="form-label small fw-semibold">Height</label>{sel(c.height, v => upC("height", v), [[8,"8 ft"],[10,"10 ft"],[12,"12 ft"],[14,"14 ft"],[16,"16 ft"],[18,"18 ft"]])}</div>}
          {cf.includes("width") && <div className="col-md-4"><label className="form-label small fw-semibold">Width</label><input className="form-control" type="number" value={c.width} onChange={e => upC("width", e.target.value)} /></div>}
          {cf.includes("length") && <div className="col-md-4"><label className="form-label small fw-semibold">Length</label><input className="form-control" type="number" value={c.length} onChange={onLen(setC)} /></div>}
          {cf.includes("poleSpacing") && <div className="col-md-4"><label className="form-label small fw-semibold">Spacing</label>{sel(c.poleSpacing, v => upC("poleSpacing", v), [[10,"10 ft"],[12,"12 ft"]])}</div>}
        </div>
      )}
      <div className="mt-3 d-flex gap-2">
        <button className="btn btn-brand" onClick={add}>Calculate &amp; Add</button>
        <button className="btn btn-outline-secondary" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// Add a product to a job: pick an existing saved product, or calculate a new one
// (which is saved to the product catalog).
function AddProduct({ prices, onAdd, onCancel }) {
  // The calculator is the interface: configure a product, and on Calculate & Add
  // we look it up by description -- reuse the saved one if it exists, else create it.
  async function addOrCreate(item) {
    try {
      const { data: existing } = await sb.from("products").select("*").eq("description", item.label).maybeSingle();
      if (existing) {
        onAdd({ kind: existing.kind, label: existing.description, config: existing.config, pricing: existing.pricing, components: existing.components });
        return;
      }
      await sb.from("products").insert({ kind: item.kind, description: item.label, config: item.config, pricing: item.pricing, components: item.components });
    } catch (e) { /* if the lookup/insert fails, still add the freshly computed item to the job */ }
    onAdd(item);
  }
  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar">Add Product</div>
      <div className="card-body">
        <ProductConfig prices={prices} onAdd={addOrCreate} onCancel={onCancel} />
      </div>
    </div>
  );
}

function PullList({ items, meta }) {
  const ORDER = [...CAT_ORDER, "Rates & Fees"];
  function grouped(comps) {
    const by = {};
    comps.filter(c => catFor(c, meta) !== "Rates & Fees").forEach(c => { const cat = catFor(c, meta); (by[cat] = by[cat] || []).push(c); });
    return ORDER.filter(cat => by[cat]).map(cat => [cat, by[cat]]);
  }
  const row = (c, i) => <tr key={i}><td>{labelFor(c, meta)}</td><td className="text-end est-num">{c.quantity}</td><td className="text-end est-num">{c.length}</td></tr>;
  const table = (comps) => (
    <table className="table table-sm table-striped mb-0">
      <thead><tr><th>Component</th><th className="text-end">Qty</th><th className="text-end">Length</th></tr></thead>
      <tbody>{grouped(comps).map(([cat, cs]) => (
        <React.Fragment key={cat}>
          <tr><td className="cat-hdr" colSpan={3}>{cat}</td></tr>
          {cs.map(row)}
        </React.Fragment>
      ))}</tbody>
    </table>
  );
  const all = {};
  items.forEach(it => it.components.forEach(c => {
    const key = (c.ref || c.name) + "|" + c.length;
    if (!all[key]) all[key] = { name: c.name, ref: c.ref, length: c.length, quantity: 0 };
    all[key].quantity += c.quantity;
  }));
  const merged = Object.values(all);
  return (
    <div className="card shadow-sm border-0">
      <div className="card-header card-title-bar">Pull List</div>
      <div className="card-body">
        {items.length === 0 ? <p className="text-muted mb-0">Add products to build the pull list.</p> : <div>
          {items.map((it, idx) => (
            <div key={idx} className="mb-4">
              <div className="fw-semibold mb-1">{it.label}</div>
              {table(it.components)}
            </div>
          ))}
          <div className="mt-4 pt-2 border-top">
            <div className="fw-bold mb-2" style={{ fontSize: "1.05rem" }}>Job Total &mdash; All Products</div>
            {table(merged)}
          </div>
        </div>}
      </div>
    </div>
  );
}

function JobEditor({ prices, meta, jobId, onBack }) {
  const [client, setClient] = useState("");
  const [zone, setZone] = useState(1);
  const [notes, setNotes] = useState("");
  const [items, setItems] = useState([]);
  const [adding, setAdding] = useState(false);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("items");
  const [err, setErr] = useState("");

  useEffect(() => {
    if (!jobId) return;
    (async () => {
      const { data, error } = await sb.from("jobs").select("*, job_items(*)").eq("id", jobId).single();
      if (error) { setErr(error.message); return; }
      setClient(data.client_name); setZone(data.zone); setNotes(data.notes || "");
      setItems((data.job_items || []).map(it => ({ kind: it.kind, label: it.label, config: it.config, pricing: it.pricing, components: it.components })));
    })();
  }, [jobId]);

  const priceFor = (it) => zone === 2 ? { install: it.pricing.z2i, kit: it.pricing.z2k } : { install: it.pricing.z1i, kit: it.pricing.z1k };
  const totalInstall = items.reduce((s, it) => s + priceFor(it).install, 0);
  const totalKit = items.reduce((s, it) => s + priceFor(it).kit, 0);

  async function save() {
    if (!client.trim()) { alert("Enter a client name."); return; }
    setSaving(true); setErr("");
    try {
      let jid = jobId;
      if (jid) {
        await sb.from("jobs").update({ client_name: client, zone, notes }).eq("id", jid);
        await sb.from("job_items").delete().eq("job_id", jid);
      } else {
        const { data, error } = await sb.from("jobs").insert({ client_name: client, zone, notes }).select().single();
        if (error) throw error;
        jid = data.id;
      }
      if (items.length) {
        const rows = items.map(it => ({ job_id: jid, kind: it.kind, label: it.label, config: it.config, pricing: it.pricing, components: it.components }));
        const { error } = await sb.from("job_items").insert(rows);
        if (error) throw error;
      }
      onBack();
    } catch (e) { setErr("Save failed: " + e.message); setSaving(false); }
  }

  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title={jobId ? "Edit Job" : "New Job"} right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-brand btn-sm" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save Job"}</button>
        </div>} />
      {err && <div className="alert alert-warning">{err}</div>}
      <div className="card shadow-sm border-0 mb-3">
        <div className="card-body row g-2">
          <div className="col-md-6"><label className="form-label small fw-semibold">Client name</label><input className="form-control" value={client} onChange={e => setClient(e.target.value)} /></div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Zone</label>
            <select className="form-select" value={zone} onChange={e => setZone(+e.target.value)}><option value={1}>Zone 1</option><option value={2}>Zone 2</option></select></div>
          <div className="col-md-3"><label className="form-label small fw-semibold">Notes</label><input className="form-control" value={notes} onChange={e => setNotes(e.target.value)} /></div>
        </div>
      </div>

      <ul className="nav nav-tabs mb-3">
        <li className="nav-item"><button className={"nav-link " + (tab === "items" ? "active" : "")} onClick={() => setTab("items")}>Products</button></li>
        <li className="nav-item"><button className={"nav-link " + (tab === "pull" ? "active" : "")} onClick={() => setTab("pull")}>Pull List</button></li>
      </ul>

      {tab === "items" ? (
        <div>
          {adding ? <AddProduct prices={prices} onAdd={it => { setItems([...items, it]); setAdding(false); }} onCancel={() => setAdding(false)} />
                  : <button className="btn btn-brand mb-3" onClick={() => setAdding(true)}>+ Add Product</button>}
          <div className="card shadow-sm border-0">
            <div className="card-header card-title-bar">Products on this Job</div>
            {items.length === 0 ? <div className="card-body text-muted">No products yet.</div> :
              <table className="table mb-0">
                <thead><tr><th>Product</th><th className="text-end">Install ({"Z" + zone})</th><th className="text-end">Kit</th><th></th></tr></thead>
                <tbody>
                  {items.map((it, i) => (
                    <tr key={i}>
                      <td>{it.label}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).install)}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).kit)}</td>
                      <td className="text-end"><button className="btn btn-sm btn-outline-danger" onClick={() => setItems(items.filter((_, j) => j !== i))}>Remove</button></td>
                    </tr>
                  ))}
                  <tr className="fw-bold"><td>Job Total</td><td className="text-end est-num">{usd.format(totalInstall)}</td><td className="text-end est-num">{usd.format(totalKit)}</td><td></td></tr>
                </tbody>
              </table>}
          </div>
        </div>
      ) : <PullList items={items} meta={meta} />}
    </div>
  );
}

function ProductsView({ prices, meta, onBack }) {
  const [products, setProducts] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [q, setQ] = useState("");
  const [seeding, setSeeding] = useState(false);
  const [progress, setProgress] = useState(0);
  const [err, setErr] = useState("");
  async function load() {
    const { data, error } = await sb.from("products").select("*").order("description");
    if (error) setErr(error.message); else setProducts(data || []);
  }
  useEffect(() => { load(); }, []);
  function grouped(comps) {
    const by = {};
    (comps || []).filter(c => catFor(c, meta) !== "Rates & Fees").forEach(c => { const cat = catFor(c, meta); (by[cat] = by[cat] || []).push(c); });
    return [...CAT_ORDER, "Rates & Fees"].filter(cat => by[cat]).map(cat => [cat, by[cat]]);
  }
  async function seedCatalog() {
    if (!window.confirm("Add all " + CATALOG.length + " standard products from the price sheets? Existing ones with the same description are refreshed at current prices.")) return;
    setSeeding(true); setProgress(0); setErr("");
    try {
      const rows = CATALOG.map(c => { const p = priceBarn(c.config, prices); return { kind: "barn", description: c.description, config: c.config, pricing: p, components: p.components }; });
      const CHUNK = 200;
      for (let i = 0; i < rows.length; i += CHUNK) {
        const { error } = await sb.from("products").upsert(rows.slice(i, i + CHUNK), { onConflict: "description" });
        if (error) throw error;
        setProgress(Math.min(rows.length, i + CHUNK));
      }
      await load();
    } catch (e) { setErr("Seed failed: " + e.message); }
    setSeeding(false);
  }
  const tokens = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const shown = (products || []).filter(p => tokens.every(t => p.description.toLowerCase().includes(t)));
  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Products" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-brand btn-sm" disabled={seeding} onClick={seedCatalog}>{seeding ? ("Loading " + progress + "/" + CATALOG.length) : "Load Catalog"}</button>
        </div>} />
      {err && <div className="alert alert-warning">{err}</div>}
      <input className="form-control mb-3" placeholder="Search products, e.g. 12x60 premium open" value={q} onChange={e => setQ(e.target.value)} />
      {products === null ? <p className="text-muted">Loading\u2026</p> :
        products.length === 0 ? <p className="text-muted">No products yet. Click <b>Load Catalog</b> to add all standard sizes from the price sheets, or calculate one on a job.</p> :
        <div className="card shadow-sm border-0">
          <div className="card-header card-title-bar">Products ({shown.length}{shown.length !== products.length ? " of " + products.length : ""})</div>
          <ul className="list-group list-group-flush">
            {shown.slice(0, 300).map(p => (
              <li key={p.id} className="list-group-item">
                <div style={{ cursor: "pointer" }} onClick={() => setOpenId(openId === p.id ? null : p.id)} className="d-flex justify-content-between">
                  <span>{p.description}</span>
                  <span className="text-muted small">{openId === p.id ? "hide" : "view"}</span>
                </div>
                {openId === p.id && <div className="mt-2">
                  <table className="table table-sm table-striped mb-0">
                    <thead><tr><th>Component</th><th className="text-end">Qty</th><th className="text-end">Length</th></tr></thead>
                    <tbody>{grouped(p.components).map(([cat, cs]) => (
                      <React.Fragment key={cat}>
                        <tr><td className="cat-hdr" colSpan={3}>{cat}</td></tr>
                        {cs.map((c, i) => <tr key={i}><td>{labelFor(c, meta)}</td><td className="text-end est-num">{c.quantity}</td><td className="text-end est-num">{c.length}</td></tr>)}
                      </React.Fragment>
                    ))}</tbody>
                  </table>
                </div>}
              </li>
            ))}
          </ul>
          {shown.length > 300 && <div className="card-footer text-muted small">Showing first 300 &mdash; narrow with the search box.</div>}
        </div>}
    </div>
  );
}

function ComponentsView({ onBack }) {
  const [rows, setRows] = useState(null);
  const [dirty, setDirty] = useState({});
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  const CATS = [...CAT_ORDER, "Rates & Fees"];
  useEffect(() => { (async () => {
    const { data, error } = await sb.from("components").select("*").order("category").order("label");
    if (error) setErr(error.message); else setRows(data || []);
  })(); }, []);
  function edit(ref, field, val) { setRows(rs => rs.map(r => r.reference === ref ? { ...r, [field]: val } : r)); setDirty(d => ({ ...d, [ref]: true })); }
  async function save() {
    setSaving(true); setErr("");
    const upd = rows.filter(r => dirty[r.reference]).map(r => ({ reference: r.reference, label: r.label, category: r.category, price: Number(r.price) }));
    const { error } = await sb.from("components").upsert(upd);
    if (error) setErr(error.message); else setDirty({});
    setSaving(false);
  }
  const nDirty = Object.keys(dirty).length;
  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Components" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-brand btn-sm" disabled={saving || nDirty === 0} onClick={save}>{saving ? "Saving\u2026" : nDirty ? ("Save (" + nDirty + ")") : "Saved"}</button>
        </div>} />
      <p className="text-muted small">Edit the display label, build category, or price. Changes save to Supabase and apply to new calculations and pull lists.</p>
      {err && <div className="alert alert-warning">{err}</div>}
      {rows === null ? <p className="text-muted">Loading\u2026</p> :
        CATS.filter(cat => rows.some(r => r.category === cat)).map(cat => (
          <div key={cat} className="card shadow-sm border-0 mb-3">
            <div className="card-header card-title-bar">{cat}</div>
            <table className="table table-sm mb-0 align-middle">
              <thead><tr><th style={{ width: "48%" }}>Label</th><th style={{ width: "24%" }}>Category</th><th style={{ width: "20%" }} className="text-end">Price</th></tr></thead>
              <tbody>
                {rows.filter(r => r.category === cat).map(r => (
                  <tr key={r.reference}>
                    <td>
                      <input className="form-control form-control-sm" value={r.label} onChange={e => edit(r.reference, "label", e.target.value)} />
                    </td>
                    <td>
                      <select className="form-select form-select-sm" value={r.category} onChange={e => edit(r.reference, "category", e.target.value)}>
                        {CATS.map(cc => <option key={cc} value={cc}>{cc}</option>)}
                      </select>
                    </td>
                    <td><input className="form-control form-control-sm text-end est-num" type="number" step="0.01" value={r.price} onChange={e => edit(r.reference, "price", e.target.value)} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [view, setView] = useState("jobs");
  const [activeJobId, setActiveJobId] = useState(null);
  if (!data) return <Login onReady={setData} />;
  if (view === "components") return <ComponentsView onBack={async () => { try { setData(await loadComponents()); } catch (e) {} setView("jobs"); }} />;
  if (view === "products") return <ProductsView prices={data.prices} meta={data.meta} onBack={() => setView("jobs")} />;
  if (view === "jobs") return <JobsList onOpen={id => { setActiveJobId(id); setView("job"); }} onNew={() => { setActiveJobId(null); setView("job"); }} onComponents={() => setView("components")} onProducts={() => setView("products")} />;
  return <JobEditor prices={data.prices} meta={data.meta} jobId={activeJobId} onBack={() => setView("jobs")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
