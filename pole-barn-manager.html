// Manage users. Admins and owners only; owners can't create or touch admins.
function UsersView({ profile, onBack }) {
  const [rows, setRows] = useState(null);
  const [nu, setNu] = useState(null);
  const [eu, setEu] = useState(null);   // user being renamed
  const [pw, setPw] = useState({});      // id -> new password
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const roles = assignableRoles(profile.role);
  async function load() {
    const { data, error } = await sb.from("profiles").select("*, orgs(name)").order("role").order("email");
    if (error) setErr(error.message); else setRows(data || []);
  }
  useEffect(() => { load(); }, []);
  const canTouch = (u) => u.id !== profile.id && (profile.role === "admin" || u.role !== "admin");
  // Renaming is harmless - unlike role or removal, you may do it to your own account.
  const canRename = (u) => u.id === profile.id || canTouch(u);
  async function run(fn, okMsg) {
    setBusy(true); setErr(""); setMsg("");
    try { await fn(); setMsg(okMsg); await load(); } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  }
  const create = () => run(async () => {
    if (!nu.email.trim() || !nu.password) throw new Error("Email and password are required.");
    await callManageUsers({ action: "create", email: nu.email.trim(), password: nu.password, first_name: nu.first_name.trim(), last_name: nu.last_name.trim(), role: nu.role });
    setNu(null);
  }, "User created.");
  const saveName = () => run(async () => {
    const { error } = await sb.from("profiles").update({
      first_name: (eu.first_name || "").trim() || null,
      last_name: (eu.last_name || "").trim() || null,
    }).eq("id", eu.id);
    if (error) throw error;
    setEu(null);
  }, "Name updated.");
  const setRole = (u, role) => run(() => sb.from("profiles").update({ role }).eq("id", u.id).then(({ error }) => { if (error) throw error; }), "Role updated.");
  const setActive = (u, active) => run(() => sb.from("profiles").update({ active }).eq("id", u.id).then(({ error }) => { if (error) throw error; }), active ? "User re-activated." : "User deactivated.");
  const resetPw = (u) => run(async () => {
    const p = pw[u.id];
    if (!p || p.length < 8) throw new Error("Password must be at least 8 characters.");
    await callManageUsers({ action: "set_password", id: u.id, password: p });
    setPw(x => ({ ...x, [u.id]: "" }));
  }, "Password updated.");
  const sendReset = (u) => run(() => callManageUsers({ action: "send_reset", email: u.email, redirectTo: window.location.href }), "Reset email sent.");
  const del = (u) => { if (!window.confirm("Remove " + u.email + "? This deletes their login for good.")) return;
    run(() => callManageUsers({ action: "delete", id: u.id }), "User removed."); };

  return (
    <div className="container py-4" style={{ maxWidth: 1000 }}>
      <Header title="Users" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-brand btn-sm" onClick={() => setNu({ email: "", first_name: "", last_name: "", password: "", role: "trainee" })}>+ New User</button>
        </div>} />
      {err && <div className="alert alert-warning py-2">{err}</div>}
      {msg && <div className="alert alert-success py-2">{msg}</div>}
      {nu && <Modal title="New User" onClose={() => setNu(null)}
        footer={<React.Fragment>
          <button className="btn btn-outline-secondary" onClick={() => setNu(null)}>Cancel</button>
          <button className="btn btn-brand" disabled={busy} onClick={create}>{busy ? "Adding\u2026" : "Add User"}</button>
        </React.Fragment>}>
        <div className="row g-3">
          <div className="col-md-6"><label className="form-label small fw-semibold">First name</label>
            <input className="form-control" autoFocus value={nu.first_name} onChange={e => setNu({ ...nu, first_name: e.target.value })} /></div>
          <div className="col-md-6"><label className="form-label small fw-semibold">Last name</label>
            <input className="form-control" value={nu.last_name} onChange={e => setNu({ ...nu, last_name: e.target.value })} /></div>
          <div className="col-12"><label className="form-label small fw-semibold">Email</label>
            <input className="form-control" value={nu.email} onChange={e => setNu({ ...nu, email: e.target.value })} />
            <div className="form-text">This is their login.</div></div>
          <div className="col-md-6"><label className="form-label small fw-semibold">Temporary password</label>
            <PasswordInput value={nu.password} onChange={v => setNu({ ...nu, password: v })} />
            <div className="form-text">They'll choose their own on first sign-in.</div></div>
          <div className="col-md-6"><label className="form-label small fw-semibold">Role</label>
            <select className="form-select" value={nu.role} onChange={e => setNu({ ...nu, role: e.target.value })}>
              {roles.map(rr => <option key={rr} value={rr}>{ROLE_LABEL[rr]}</option>)}
            </select></div>
        </div>
      </Modal>}
      {eu && <Modal title="Edit User" onClose={() => setEu(null)}
        footer={<React.Fragment>
          <button className="btn btn-outline-secondary" onClick={() => setEu(null)}>Cancel</button>
          <button className="btn btn-brand" disabled={busy} onClick={saveName}>{busy ? "Saving\u2026" : "Save"}</button>
        </React.Fragment>}>
        <div className="row g-3">
          <div className="col-md-6"><label className="form-label small fw-semibold">First name</label>
            <input className="form-control" autoFocus value={eu.first_name} placeholder="Hunter"
              onChange={e => setEu({ ...eu, first_name: e.target.value })}
              onKeyDown={e => { if (e.key === "Enter") saveName(); }} /></div>
          <div className="col-md-6"><label className="form-label small fw-semibold">Last name</label>
            <input className="form-control" value={eu.last_name} placeholder="Nelson"
              onChange={e => setEu({ ...eu, last_name: e.target.value })}
              onKeyDown={e => { if (e.key === "Enter") saveName(); }} /></div>
          <div className="col-12"><label className="form-label small fw-semibold">Email</label>
            <input className="form-control" value={eu.email || ""} disabled />
            <div className="form-text">Email is the login and can't be changed here.</div></div>
        </div>
      </Modal>}
      {rows === null ? <p className="text-muted">Loading&hellip;</p> :
        <div className="card shadow-sm border-0">
          <div className="card-header card-title-bar">Users ({rows.length})</div>
          <ul className="list-group list-group-flush">
            {rows.map(u => (
              <li key={u.id} className={"list-group-item" + (u.active ? "" : " bg-light")}>
                <div className="d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div>
                    <b>{displayName(u)}</b>{u.id === profile.id && <span className="badge text-bg-secondary ms-2">you</span>}
                    {!u.active && <span className="badge text-bg-warning ms-2">inactive</span>}
                    <div className="text-muted small">{u.email}{isSuper(profile.role) && u.orgs ? " \u00b7 " + u.orgs.name : ""}</div>
                  </div>
                  <div className="d-flex align-items-center gap-2 flex-wrap">
                    <button className="btn btn-sm btn-outline-secondary" disabled={!canRename(u) || busy}
                      onClick={() => { setNu(null); setEu({ id: u.id, first_name: u.first_name || "", last_name: u.last_name || "", email: u.email }); }}>Edit</button>
                    <select className="form-select form-select-sm" style={{ width: "auto" }} disabled={!canTouch(u) || busy}
                      value={u.role} onChange={e => setRole(u, e.target.value)}>
                      {(canTouch(u) ? roles : [u.role]).map(r => <option key={r} value={r}>{ROLE_LABEL[r]}</option>)}
                    </select>
                    <span style={{ width: 150 }}><PasswordInput size="sm" placeholder="New password"
                      value={pw[u.id] || ""} onChange={v => setPw(x => ({ ...x, [u.id]: v }))} /></span>
                    <button className="btn btn-sm btn-outline-secondary" disabled={!canTouch(u) || busy} onClick={() => resetPw(u)}>Set</button>
                    <button className="btn btn-sm btn-outline-secondary" disabled={!canTouch(u) || busy} onClick={() => sendReset(u)}>Email reset</button>
                    <button className="btn btn-sm btn-outline-secondary" disabled={!canTouch(u) || busy} onClick={() => setActive(u, !u.active)}>{u.active ? "Deactivate" : "Activate"}</button>
                    <button className="btn btn-sm btn-outline-danger" disabled={!canTouch(u) || busy} onClick={() => del(u)}>Remove</button>
                  </div>
                </div>
              </li>
            ))}
          </ul>
        </div>}
      <p className="text-muted small mt-2">Owners can manage everyone except admins. You can't change or remove your own account. Any password set here is temporary &mdash; the user chooses their own on their next sign-in.</p>
    </div>
  );
}

function JobFeesView({ orgId, onBack }) {
  const [rows, setRows] = useState(null);
  const [dirty, setDirty] = useState({});
  const [saving, setSaving] = useState(false);
  const [nf, setNf] = useState(null);
  const [err, setErr] = useState("");
  async function load() {
    let q = sb.from("job_fees").select("*").order("label");
    if (orgId) q = q.eq("org_id", orgId);
    const { data, error } = await q;
    if (error) setErr(error.message); else setRows(data || []);
  }
  useEffect(() => { load(); }, [orgId]);
  function edit(id, field, val) { setRows(rs => rs.map(r => r.id === id ? { ...r, [field]: val } : r)); setDirty(d => ({ ...d, [id]: true })); }
  async function save() {
    setSaving(true); setErr("");
    try {
      const upd = rows.filter(r => dirty[r.id]).map(r => ({ id: r.id, label: r.label, kind: r.kind, rate: Number(r.rate) || 0 }));
      if (upd.length) { const { error } = await sb.from("job_fees").upsert(upd); if (error) throw error; }
      setDirty({});
    } catch (e) { setErr(e.message); }
    setSaving(false);
  }
  async function create() {
    const label = (nf.label || "").trim();
    if (!label) { alert("Enter a fee name."); return; }
    const { error } = await sb.from("job_fees").insert({ org_id: orgId, label, kind: nf.kind, rate: Number(nf.rate) || 0 });
    if (error) { setErr(error.message); return; }
    setNf(null); load();
  }
  async function del(row) {
    if (!window.confirm("Delete \"" + row.label + "\"?\n\nJobs already using it keep their saved line and amount.")) return;
    const { error } = await sb.from("job_fees").delete().eq("id", row.id);
    if (error) setErr(error.message); else load();
  }
  const nDirty = Object.keys(dirty).length;
  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Job Fees" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-outline-light btn-sm" onClick={() => setNf({ label: "", kind: "flat", rate: "" })}>+ New</button>
          <button className="btn btn-brand btn-sm" disabled={saving || nDirty === 0} onClick={save}>{saving ? "Saving\u2026" : nDirty ? ("Save (" + nDirty + ")") : "Saved"}</button>
        </div>} />
      <p className="text-muted small">One-off charges you add to a job &mdash; permits, crane time, and so on. Separate from the <b>Rates &amp; Fees</b> components, which are built into every calculated barn price.</p>
      {err && <div className="alert alert-warning">{err}</div>}
      {nf && <Modal title="New Job Fee" onClose={() => setNf(null)} width={480}
        footer={<React.Fragment>
          <button className="btn btn-outline-secondary" onClick={() => setNf(null)}>Cancel</button>
          <button className="btn btn-brand" onClick={createFee}>Create</button>
        </React.Fragment>}>
        <div className="row g-3">
          <div className="col-12"><label className="form-label small fw-semibold">Job fee name</label>
            <input className="form-control" autoFocus value={nf.label} onChange={e => setNf({ ...nf, label: e.target.value })} placeholder="e.g. Permit Fee" /></div>
          <div className="col-md-7"><label className="form-label small fw-semibold">Type</label>
            <select className="form-select" value={nf.kind} onChange={e => setNf({ ...nf, kind: e.target.value })}>
              <option value="flat">Flat rate</option><option value="hourly">Hourly rate</option>
            </select></div>
          <div className="col-md-5"><label className="form-label small fw-semibold">Rate</label>
            <input className="form-control text-end" type="number" step="0.01" value={nf.rate} onChange={e => setNf({ ...nf, rate: e.target.value })} /></div>
        </div>
      </Modal>}
      {rows === null ? <p className="text-muted">Loading&hellip;</p> :
        rows.length === 0 ? <p className="text-muted">No job fees yet. Click <b>+ New</b> to create one.</p> :
        <div className="card shadow-sm border-0">
          <div className="card-header card-title-bar">Job Fees ({rows.length})</div>
          <table className="table table-sm mb-0 align-middle">
            <thead><tr>
              <th style={{ width: "50%" }}>Name</th><th style={{ width: "22%" }}>Type</th>
              <th style={{ width: "22%" }} className="text-end">Rate</th><th style={{ width: "6%" }}></th>
            </tr></thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.id}>
                  <td><input className="form-control form-control-sm" value={r.label} onChange={e => edit(r.id, "label", e.target.value)} /></td>
                  <td><select className="form-select form-select-sm" value={r.kind} onChange={e => edit(r.id, "kind", e.target.value)}>
                    <option value="flat">Flat rate</option><option value="hourly">Hourly rate</option>
                  </select></td>
                  <td><div className="d-flex align-items-center gap-1">
                    <input className="form-control form-control-sm text-end est-num" type="number" step="0.01" value={r.rate} onChange={e => edit(r.id, "rate", e.target.value)} />
                    <span className="text-muted small text-nowrap">{r.kind === "hourly" ? "/hr" : ""}</span>
                  </div></td>
                  <td className="text-end"><button className="btn btn-sm btn-outline-danger" onClick={() => del(r)}>&times;</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
    </div>
  );
}

function ComponentsView({ profile, orgId, orgs, onBack }) {
  const [rows, setRows] = useState(null);
  const [cats, setCats] = useState({});
  const [dirty, setDirty] = useState({});
  const [catDirty, setCatDirty] = useState({});
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  const [nc, setNc] = useState(null);
  const CATS = [...CAT_ORDER, ...NON_MATERIAL_CATS];
  async function load() {
    let q = sb.from("components").select("*").order("category").order("label");
    if (orgId) q = q.eq("org_id", orgId);
    const { data, error } = await q;
    if (error) { setErr(error.message); return; }
    setRows(data || []);
    let cq = sb.from("category_markups").select("*");
    if (orgId) cq = cq.eq("org_id", orgId);
    const { data: cm } = await cq;
    const m = {}; (cm || []).forEach(c => { m[c.category] = Number(c.markup) || 0; });
    setCats(m);
  }
  useEffect(() => { load(); }, [orgId]);
  function edit(ref, field, val) { setRows(rs => rs.map(r => r.reference === ref ? { ...r, [field]: val } : r)); setDirty(d => ({ ...d, [ref]: true })); }
  function editCat(cat, val) { setCats(c => ({ ...c, [cat]: val })); setCatDirty(d => ({ ...d, [cat]: true })); }
  const effMarkup = (r) => (r.markup === "" || r.markup == null) ? (Number(cats[r.category]) || 0) : Number(r.markup);
  const costOf = (r) => Number(r.cost != null ? r.cost : r.price) || 0;
  const retail = (r) => retailOf(costOf(r), effMarkup(r));
  async function save() {
    setSaving(true); setErr("");
    try {
      // org_id must ride along: a component is unique per (org_id, reference), so
      // without it two companies' rows would target the same one.
      const upd = rows.filter(r => dirty[r.reference]).map(r => ({
        org_id: r.org_id || orgId,
        reference: r.reference, label: r.label, category: r.category,
        cost: costOf(r),
        markup: (r.markup === "" || r.markup == null) ? null : Number(r.markup),
        price: retail(r),   // keep the stored retail in sync
      }));
      if (upd.length) { const { error } = await sb.from("components").upsert(upd, { onConflict: "org_id,reference" }); if (error) throw error; }
      const cupd = Object.keys(catDirty).map(c => ({ org_id: orgId, category: c, markup: Number(cats[c]) || 0 }));
      if (cupd.length) { const { error } = await sb.from("category_markups").upsert(cupd, { onConflict: "org_id,category" }); if (error) throw error; }
      setDirty({}); setCatDirty({});
    } catch (e) { setErr(e.message); }
    setSaving(false);
  }
  // Only components created in-app can be removed. The engine references the
  // original components by key (post_8x8, syp_2x6x10, ...), so deleting one of
  // those would break every calculation.
  const isCustomComp = (ref) => String(ref).startsWith("custom_");
  async function delComponent(row) {
    if (!window.confirm("Delete component \"" + row.label + "\"?\n\nProducts already using it keep their saved line and price. This can't be undone.")) return;
    setErr("");
    const { error } = await sb.from("components").delete().eq("reference", row.reference);
    if (error) setErr(error.message); else load();
  }
  async function createComponent() {
    const label = (nc.label || "").trim();
    if (!label) { alert("Enter a component name."); return; }
    const c = Number(nc.cost) || 0;
    const { error } = await sb.from("components").insert({ org_id: orgId, reference: makeRef(label), label, category: nc.category, cost: c, price: retailOf(c, Number(cats[nc.category]) || 0) });
    if (error) { setErr(error.message); return; }
    setNc(null); load();
  }
  // Zone margins are stored as fractions (0.01 = 1%) but shown/edited as percents.
  const asPct = (r) => { const v = Number(r.cost != null ? r.cost : r.price) || 0; return Math.round(v * 10000) / 100; };
  const editPct = (ref, val) => edit(ref, "cost", (Number(val) || 0) / 100);
  const nDirty = Object.keys(dirty).length + Object.keys(catDirty).length;
  return (
    <div className="container py-4" style={{ maxWidth: 1000 }}>
      <Header title="Components" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-outline-light btn-sm" onClick={() => setNc({ label: "", category: "Custom", cost: "" })}>+ New</button>
          <button className="btn btn-brand btn-sm" disabled={saving || nDirty === 0} onClick={save}>{saving ? "Saving\u2026" : nDirty ? ("Save (" + nDirty + ")") : "Saved"}</button>
        </div>} />
      <p className="text-muted small">Enter your <b>cost</b> and a <b>margin %</b>; <b>retail = cost &divide; (1 &minus; margin)</b>, and retail is what the calculator and price sheets use. Each category has a default margin &mdash; leave a component's margin blank to inherit it, or enter a value to override it for that one component.</p>
      {err && <div className="alert alert-warning">{err}</div>}
      {nc && <Modal title="New Component" onClose={() => setNc(null)} width={480}
        footer={<React.Fragment>
          <button className="btn btn-outline-secondary" onClick={() => setNc(null)}>Cancel</button>
          <button className="btn btn-brand" onClick={createComponent}>Create</button>
        </React.Fragment>}>
        <div className="row g-3">
          <div className="col-12"><label className="form-label small fw-semibold">Component name</label>
            <input className="form-control" autoFocus value={nc.label} onChange={e => setNc({ ...nc, label: e.target.value })} /></div>
          <div className="col-md-7"><label className="form-label small fw-semibold">Category</label>
            <select className="form-select" value={nc.category} onChange={e => setNc({ ...nc, category: e.target.value })}>
              {CATS.map(c => <option key={c} value={c}>{c}</option>)}
            </select></div>
          <div className="col-md-5"><label className="form-label small fw-semibold">Cost</label>
            <input className="form-control text-end" type="number" step="0.01" value={nc.cost} onChange={e => setNc({ ...nc, cost: e.target.value })} /></div>
        </div>
      </Modal>}
      {rows === null ? <p className="text-muted">Loading&hellip;</p> :
        CATS.filter(cat => rows.some(r => r.category === cat)).map(cat => cat === "Zone Margins" ? (
          <div key={cat} className="card shadow-sm border-0 mb-3">
            <div className="card-header card-title-bar">{cat}</div>
            <div className="card-body pb-0">
              <p className="text-muted small mb-2">Pricing margins, not costs. A zone's price is the base price &divide; (1 &minus; margin) &mdash; so 1% turns $100 into $101.01.</p>
            </div>
            <table className="table table-sm mb-0 align-middle">
              <thead><tr><th style={{ width: "70%" }}>Label</th><th style={{ width: "30%" }} className="text-end">Margin %</th></tr></thead>
              <tbody>
                {rows.filter(r => r.category === cat).map(r => (
                  <tr key={r.reference}>
                    <td><input className="form-control form-control-sm" value={r.label} onChange={e => edit(r.reference, "label", e.target.value)} /></td>
                    <td><input className="form-control form-control-sm text-end est-num" type="number" step="0.01" value={asPct(r)} onChange={e => editPct(r.reference, e.target.value)} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div key={cat} className="card shadow-sm border-0 mb-3">
            <div className="card-header card-title-bar d-flex justify-content-between align-items-center">
              <span>{cat}{cat === "Rates & Fees" ? <span style={{ textTransform: "none", letterSpacing: 0, fontWeight: 400, opacity: .75 }}> &mdash; built into calculated prices</span> : ""}</span>
              <span className="d-flex align-items-center gap-2" style={{ textTransform: "none", letterSpacing: 0 }}>
                <span className="small">Category margin</span>
                <input className="form-control form-control-sm text-end" style={{ width: 78 }} type="number" step="0.1"
                  value={cats[cat] != null ? cats[cat] : 0} onChange={e => editCat(cat, e.target.value)} />
                <span className="small">%</span>
              </span>
            </div>
            <table className="table table-sm mb-0 align-middle">
              <thead><tr>
                <th style={{ width: "38%" }}>Label</th><th style={{ width: "18%" }}>Category</th>
                <th style={{ width: "14%" }} className="text-end">Cost</th>
                <th style={{ width: "14%" }} className="text-end">Margin %</th>
                <th style={{ width: "14%" }} className="text-end">Retail</th>
                <th style={{ width: "2%" }}></th>
              </tr></thead>
              <tbody>
                {rows.filter(r => r.category === cat).map(r => (
                  <tr key={r.reference}>
                    <td><input className="form-control form-control-sm" value={r.label} onChange={e => edit(r.reference, "label", e.target.value)} /></td>
                    <td><select className="form-select form-select-sm" value={r.category} onChange={e => edit(r.reference, "category", e.target.value)}>
                      {CATS.map(cc => <option key={cc} value={cc}>{cc}</option>)}
                    </select></td>
                    <td><input className="form-control form-control-sm text-end est-num" type="number" step="0.01" value={r.cost != null ? r.cost : (r.price != null ? r.price : "")} onChange={e => edit(r.reference, "cost", e.target.value)} /></td>
                    <td><input className="form-control form-control-sm text-end est-num" type="number" step="0.1" placeholder={String(Number(cats[cat]) || 0)}
                      value={r.markup == null ? "" : r.markup} onChange={e => edit(r.reference, "markup", e.target.value)} /></td>
                    <td className="text-end est-num fw-semibold">{usd.format(retail(r))}</td>
                    <td className="text-end">{isCustomComp(r.reference) && <button className="btn btn-sm btn-outline-danger" title="Delete component" onClick={() => delComponent(r)}>&times;</button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [booting, setBooting] = useState(true);
  const [view, setView] = useState("jobs");
  const [activeJobId, setActiveJobId] = useState(null);
  const [orgId, setOrgId] = useState(null);
  const [orgs, setOrgs] = useState([]);

  useEffect(() => { (async () => {
    try {
      const prof = await currentProfile();
      if (prof) {
        setOrgId(prof.org_id);
        const d = await loadComponents(prof.role, prof.org_id);
        setData({ ...d, profile: prof });
        if (isSuper(prof.role)) { const { data: os } = await sb.from("orgs").select("id,name").order("name"); setOrgs(os || []); }
      }
    } catch (e) {}
    setBooting(false);
  })(); }, []);

  if (booting) return <div className="lockwrap"><div style={{ color: "#aeb3b8" }}>Loading&hellip;</div></div>;
  if (!data) return <Login onReady={async d => {
    setData(d); setOrgId(d.profile.org_id);
    if (isSuper(d.profile.role)) { const { data: os } = await sb.from("orgs").select("id,name").order("name"); setOrgs(os || []); }
    setView(d.profile.role === "assistant" ? "sheets" : "jobs");
  }} />;

  const signOut = async () => { await sb.auth.signOut(); setData(null); setView("jobs"); };

  // A password someone else set is temporary - no access until they choose their own.
  if (data.profile.must_change_password) return <SetPassword profile={data.profile} onSignOut={signOut}
    onDone={() => setData(d => ({ ...d, profile: { ...d.profile, must_change_password: false } }))} />;

  const role = data.profile.role;
  // Switching company reloads that company's prices - everything downstream follows.
  const switchOrg = async (id) => {
    setOrgId(id);
    try { const d = await loadComponents(role, id); setData(dd => ({ ...dd, ...d })); } catch (e) {}
    setActiveJobId(null); setView(view === "job" ? "jobs" : view);
  };
  const ctx = {
    profile: data.profile,
    onSignOut: signOut,
    onSettings: canManageUsers(role) ? () => setView("settings") : null,
    orgId, orgs, onSwitchOrg: switchOrg,
  };

  const screen = () => {
    if (role === "assistant") return <PriceSheets prices={data.prices} profile={data.profile} onBack={null} />;
    if (view === "settings" && canManageUsers(role)) return <SettingsView profile={data.profile} onUsers={() => setView("users")} onOrgs={() => setView("orgs")} onBack={() => setView("jobs")} />;
    if (view === "orgs" && isSuper(role)) return <OrgsView profile={data.profile} onBack={() => setView("settings")} />;
    if (view === "users" && canManageUsers(role)) return <UsersView profile={data.profile} onBack={() => setView("settings")} />;
    if (view === "fees" && isManager(role)) return <JobFeesView orgId={orgId} onBack={() => setView("jobs")} />;
    if (view === "sheets" && canSeeSheets(role)) return <PriceSheets prices={data.prices} profile={data.profile} onBack={() => setView("jobs")} />;
    if (view === "products" && isManager(role)) return <ProductsView prices={data.prices} meta={data.meta} orgId={orgId} onBack={() => setView("jobs")} />;
    if (view === "components" && isManager(role)) return <ComponentsView profile={data.profile} orgId={orgId} orgs={orgs} onBack={async () => { try { setData({ ...(await loadComponents(role, orgId)), profile: data.profile }); } catch (e) {} setView("jobs"); }} />;
    if (view === "job") return <JobEditor prices={data.prices} meta={data.meta} profile={data.profile} orgId={orgId} jobId={activeJobId} onBack={() => setView("jobs")} />;
    return <JobsList profile={data.profile} orgId={orgId}
      onOpen={id => { setActiveJobId(id); setView("job"); }}
      onNew={() => { setActiveJobId(null); setView("job"); }}
      onComponents={() => setView("components")} onProducts={() => setView("products")}
      onSheets={() => setView("sheets")} onFees={() => setView("fees")} />;
  };
  return <AppCtx.Provider value={ctx}>{screen()}</AppCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
