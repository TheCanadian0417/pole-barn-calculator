      )}
      <div className="mt-3 d-flex gap-2">
        <button className="btn btn-brand" onClick={add}>{submitLabel || "Calculate & Add"}</button>
        <button className="btn btn-outline-secondary" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// Add a product to a job: pick an existing saved product, or calculate a new one
// (which is saved to the product catalog).
function AddProduct({ prices, meta, onAdd, onCancel }) {
  const [mode, setMode] = useState("calc");
  const [customs, setCustoms] = useState(null);
  const [creating, setCreating] = useState(false);
  useEffect(() => { if (mode === "custom") loadCustoms(); }, [mode]);
  async function loadCustoms() {
    const { data } = await sb.from("products").select("*").eq("kind", "custom").order("description");
    setCustoms(data || []);
  }
  async function addOrCreate(item) { onAdd(await resolveProduct(item)); }
  const pickCustom = (p) => onAdd({ kind: "custom", label: p.description, config: p.config || {}, pricing: p.pricing, components: p.components });
  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar d-flex justify-content-between">
        <span>Add Product</span>
        <div className="btn-group btn-group-sm">
          <button className={"btn btn-sm " + (mode === "calc" ? "btn-brand" : "btn-outline-light")} onClick={() => { setMode("calc"); setCreating(false); }}>Calculate</button>
          <button className={"btn btn-sm " + (mode === "custom" ? "btn-brand" : "btn-outline-light")} onClick={() => setMode("custom")}>Custom</button>
        </div>
      </div>
      <div className="card-body">
        {mode === "calc" ? <ProductConfig prices={prices} onAdd={addOrCreate} onCancel={onCancel} /> :
          creating ? <ProductEditor prices={prices} meta={meta} product={{ kind: "custom", components: [] }} onDone={() => { setCreating(false); loadCustoms(); }} onCancel={() => setCreating(false)} /> :
          <div>
            <div className="d-flex justify-content-between align-items-center mb-2">
              <span className="small text-muted">Pick a saved custom product, or create a new one.</span>
              <button className="btn btn-sm btn-outline-secondary" onClick={() => setCreating(true)}>+ New Custom Product</button>
            </div>
            {customs === null ? <p className="text-muted mb-0">Loading&hellip;</p> :
              customs.length === 0 ? <p className="text-muted mb-0">No custom products yet.</p> :
              <div className="list-group" style={{ maxHeight: 280, overflowY: "auto" }}>
                {customs.map(p => (
                  <button key={p.id} className="list-group-item list-group-item-action" onClick={() => pickCustom(p)}>
                    <div>{p.description}</div>
                    {p.description_text && <div className="text-muted small">{p.description_text}</div>}
                  </button>
                ))}
              </div>}
            <button className="btn btn-outline-secondary mt-3" onClick={onCancel}>Cancel</button>
          </div>}
      </div>
    </div>
  );
}

function PullList({ items: allItems, meta }) {
  // A pull list is materials only. An item earns a place by actually having
  // component lines that are materials - not by what it calls itself.
  const materialLines = (it) => (Array.isArray(it.components) ? it.components : [])
    .filter(c => c && c.ref !== undefined || c && c.name)
    .filter(c => NON_MATERIAL_CATS.indexOf(catFor(c, meta)) === -1);
  const items = (allItems || []).filter(it => it.kind !== "fee" && materialLines(it).length > 0);
  const ORDER = [...CAT_ORDER, ...NON_MATERIAL_CATS];
  const heightOf = (it) => (it.config && it.config.barnHeight) || BARN_HEIGHT_STANDARD;
  const ctxOf = (it) => ({ postSize: it.config && it.config.postSize, barnHeight: heightOf(it) });
  function grouped(comps) {
    const by = {};
    comps.filter(c => NON_MATERIAL_CATS.indexOf(catFor(c, meta)) === -1).forEach(c => { const cat = catFor(c, meta); (by[cat] = by[cat] || []).push(c); });
    return ORDER.filter(cat => by[cat]).map(cat => [cat, by[cat]]);
  }
  const row = (c, i, ctx) => <tr key={i}><td>{lineLabel(c, meta, ctx)}</td><td className="text-end est-num">{c.quantity}</td><td className="text-end est-num">{c.length}</td></tr>;
  const table = (comps, ctx) => (
    <table className="table table-sm table-striped mb-0">
      <thead><tr><th>Component</th><th className="text-end">Qty</th><th className="text-end">Length</th></tr></thead>
      <tbody>{grouped(comps).map(([cat, cs]) => (
        <React.Fragment key={cat}>
          <tr><td className="cat-hdr" colSpan={3}>{cat}</td></tr>
          {cs.map((c, i) => row(c, i, ctx))}
        </React.Fragment>
      ))}</tbody>
    </table>
  );
  // Consolidated: posts of the same size but different heights stay separate lines.
  const all = {};
  items.forEach(it => {
    const ctx = ctxOf(it);
    materialLines(it).forEach(c => {
      const key = (c.ref || c.name) + "|" + c.length + (isPostRef(c.ref) ? "|" + ctx.postSize + "|" + ctx.barnHeight : "");
      if (!all[key]) all[key] = { name: c.name, ref: c.ref, length: c.length, quantity: 0, _ctx: isPostRef(c.ref) ? ctx : null };
      all[key].quantity += c.quantity;
    });
  });
  const merged = Object.values(all);
  const mergedTable = (
    <table className="table table-sm table-striped mb-0">
      <thead><tr><th>Component</th><th className="text-end">Qty</th><th className="text-end">Length</th></tr></thead>
      <tbody>{grouped(merged).map(([cat, cs]) => (
        <React.Fragment key={cat}>
          <tr><td className="cat-hdr" colSpan={3}>{cat}</td></tr>
          {cs.map((c, i) => <tr key={i}><td>{lineLabel(c, meta, c._ctx)}</td><td className="text-end est-num">{c.quantity}</td><td className="text-end est-num">{c.length}</td></tr>)}
        </React.Fragment>
      ))}</tbody>
    </table>
  );
  return (
    <div className="card shadow-sm border-0">
      <div className="card-header card-title-bar">Pull List</div>
      <div className="card-body">
        {items.length === 0 ? <p className="text-muted mb-0">Add products to build the pull list.</p> : <div>
          {items.filter(it => it.kind !== "component").map((it, idx) => {
            const size = it.config && it.config.postSize;
            const opts = size ? barnHeightsFor(size) : null;
            return (
              <div key={idx} className="mb-4">
                <div className="fw-semibold mb-1">{it.label}{opts ? " \u2014 " + heightOf(it) + "' Height" : ""}</div>
                {table(materialLines(it), ctxOf(it))}
              </div>
            );
          })}
          {items.some(it => it.kind === "component") && (
            <div className="mb-4">
              <div className="fw-semibold mb-1">Additional Components</div>
              {table(items.filter(it => it.kind === "component").flatMap(it => materialLines(it)), null)}
            </div>
          )}
          <div className="mt-4 pt-2 border-top">
            <div className="fw-bold mb-2" style={{ fontSize: "1.05rem" }}>Job Total &mdash; All Products</div>
            {mergedTable}
          </div>
        </div>}
      </div>
    </div>
  );
}

// Add a bare component to a job (sono tubes, a cupola, anything you just order).
// It has materials, so it appears on the pull list; it has no build, so it isn't
// a product. Priced at retail x qty x length.
function AddComponentItem({ prices, meta, item, onAdd, onCancel }) {
  const refs = Object.keys(meta || {})
    .filter(rf => NON_MATERIAL_CATS.indexOf((meta[rf] || {}).category) === -1)
    .sort((a, b) => ((meta[a].label || a).localeCompare(meta[b].label || b)));
  const c0 = item && item.components && item.components[0];
  const [ref, setRef] = useState(c0 ? c0.ref : refs[0]);
  const [qty, setQty] = useState(c0 ? c0.quantity : 1);
  const [len, setLen] = useState(c0 ? c0.length : 1);
  const unit = prices[ref] || 0;
  const amount = Math.ceil(unit * (Number(qty) || 0) * (Number(len) || 1));
  function add() {
    const q = Number(qty) || 0, l = Number(len) || 1;
    if (!ref) { alert("Pick a component."); return; }
    if (q <= 0) { alert("Enter a quantity."); return; }
    const label = (meta[ref] || {}).label || ref;
    onAdd({
      kind: "component",
      label: componentItemLabel(label, q),
      config: { ref, quantity: q, length: l },
      pricing: componentItemPricing(unit, q, l),
      components: [{ ref, name: label, quantity: q, length: l, unitPrice: unit }],
    });
  }
  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar">{item ? "Edit Component" : "Add Component"}</div>
      <div className="card-body">
        <div className="row g-2 align-items-end">
          <div className="col-md-5"><label className="form-label small fw-semibold">Component</label>
            <select className="form-select" value={ref} onChange={e => setRef(e.target.value)}>
              {refs.map(rf => <option key={rf} value={rf}>{(meta[rf] || {}).label || rf}</option>)}
            </select></div>
          <div className="col-md-2"><label className="form-label small fw-semibold">Qty</label>
            <input className="form-control text-end" type="number" value={qty} onChange={e => setQty(e.target.value)} /></div>
          <div className="col-md-2"><label className="form-label small fw-semibold">Length</label>
            <input className="form-control text-end" type="number" value={len} onChange={e => setLen(e.target.value)} /></div>
          <div className="col-md-3 text-end"><label className="form-label small fw-semibold d-block">Amount</label>
            <span className="est-num fw-bold" style={{ fontSize: "1.1rem" }}>{usd.format(amount)}</span></div>
        </div>
        <div className="form-text">Appears on the pull list. Length is a multiplier &mdash; leave it at 1 for counted items.</div>
        <div className="mt-3 d-flex gap-2">
          <button className="btn btn-brand" onClick={add}>{item ? "Save Changes" : "Add to Job"}</button>
          <button className="btn btn-outline-secondary" onClick={onCancel}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// Job fees: one-off charges added to a specific job (permits, crane time, etc).
// Distinct from the "Rates & Fees" components, which are built into every
// calculated barn price. Job fees have no components, so they never hit a pull list.
function AddFee({ item, onAdd, onCancel }) {
  const [fees, setFees] = useState(null);
  const [feeId, setFeeId] = useState("");
  const [units, setUnits] = useState(item ? (item.config.units || 1) : 1);
  const [nf, setNf] = useState(null);
  const [err, setErr] = useState("");
  async function load() {
    const { data } = await sb.from("job_fees").select("*").order("label");
    setFees(data || []);
    if (item && item.config && item.config.feeId) setFeeId(item.config.feeId);
    else if (data && data.length && !feeId) setFeeId(data[0].id);
  }
  useEffect(() => { load(); }, []);
  const sel = (fees || []).find(f => f.id === feeId);
  async function createFee() {
    const label = (nf.label || "").trim();
    if (!label) { alert("Enter a fee name."); return; }
    const { data, error } = await sb.from("job_fees").insert({ label, kind: nf.kind, rate: Number(nf.rate) || 0 }).select().single();
    if (error) { setErr(error.message); return; }
    const { data: all } = await sb.from("job_fees").select("*").order("label");
    setFees(all || []); setFeeId(data.id); setNf(null);
  }
  function add() {
    if (!sel) { alert("Pick a job fee."); return; }
    const u = Number(units) || 0;
    if (u <= 0) { alert(sel.kind === "hourly" ? "Enter the hours." : "Enter a quantity."); return; }
    onAdd({
      kind: "fee",
      label: feeLabel(sel.label, sel.kind, sel.rate, u),
      config: { feeId: sel.id, feeName: sel.label, feeKind: sel.kind, rate: Number(sel.rate), units: u },
      pricing: feePricing(sel.kind, sel.rate, u),
      components: [],
    });
  }
  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar">{item ? "Edit Job Fee" : "Add Job Fee"}</div>
      <div className="card-body">
        {err && <div className="alert alert-warning py-2">{err}</div>}
        {nf ? (
          <div className="border rounded p-2 mb-3 bg-light row g-2 align-items-end">
            <div className="col-md-5"><label className="form-label small fw-semibold mb-0">Job fee name</label>
              <input className="form-control form-control-sm" autoFocus value={nf.label} onChange={e => setNf({ ...nf, label: e.target.value })} placeholder="e.g. Permit Fee" /></div>
            <div className="col-md-3"><label className="form-label small fw-semibold mb-0">Type</label>
              <select className="form-select form-select-sm" value={nf.kind} onChange={e => setNf({ ...nf, kind: e.target.value })}>
                <option value="flat">Flat rate</option><option value="hourly">Hourly rate</option>
              </select></div>
            <div className="col-md-2"><label className="form-label small fw-semibold mb-0">Rate</label>
              <input className="form-control form-control-sm text-end" type="number" step="0.01" value={nf.rate} onChange={e => setNf({ ...nf, rate: e.target.value })} /></div>
            <div className="col-md-2 d-flex gap-1">
              <button className="btn btn-sm btn-brand" onClick={createFee}>Create</button>
              <button className="btn btn-sm btn-outline-secondary" onClick={() => setNf(null)}>Cancel</button>
            </div>
          </div>
        ) : (
          <div className="d-flex justify-content-end mb-2">
            <button className="btn btn-sm btn-outline-secondary" onClick={() => setNf({ label: "", kind: "flat", rate: "" })}>+ New Job Fee</button>
          </div>
        )}
        {fees === null ? <p className="text-muted mb-0">Loading&hellip;</p> :
          fees.length === 0 ? <p className="text-muted mb-0">No job fees yet &mdash; use <b>+ New Job Fee</b> to create one.</p> :
          <div className="row g-2 align-items-end">
            <div className="col-md-6"><label className="form-label small fw-semibold">Job fee</label>
              <select className="form-select" value={feeId} onChange={e => setFeeId(e.target.value)}>
                {fees.map(f => <option key={f.id} value={f.id}>{f.label} &mdash; {usd.format(f.rate)}{f.kind === "hourly" ? "/hr" : ""}</option>)}
              </select></div>
            <div className="col-md-3"><label className="form-label small fw-semibold">{sel && sel.kind === "hourly" ? "Hours" : "Quantity"}</label>
              <input className="form-control text-end" type="number" step={sel && sel.kind === "hourly" ? "0.25" : "1"} value={units} onChange={e => setUnits(e.target.value)} /></div>
            <div className="col-md-3 text-end"><label className="form-label small fw-semibold d-block">Amount</label>
              <span className="est-num fw-bold" style={{ fontSize: "1.1rem" }}>{sel ? usd.format(feeAmount(sel.kind, sel.rate, units)) : "\u2014"}</span></div>
          </div>}
        <div className="mt-3 d-flex gap-2">
          <button className="btn btn-brand" onClick={add}>{item ? "Save Changes" : "Add to Job"}</button>
          <button className="btn btn-outline-secondary" onClick={onCancel}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// Re-configure an item already on a job.
//  - barns/closures: change dimensions; the product is looked up again so the price updates
//  - custom products: edit its components in place (same editor as the Products page)
function EditItem({ prices, meta, item, onSave, onCancel }) {
  const isCustom = item.kind === "custom";
  const isFee = item.kind === "fee";
  const [custom, setCustom] = useState(null);
  useEffect(() => {
    if (!isCustom) return;
    (async () => {
      const { data } = await sb.from("products").select("*").eq("description", item.label).maybeSingle();
      setCustom(data || { kind: "custom", description: item.label, components: item.components || [], config: item.config || {} });
    })();
  }, []);
  if (isFee) return <AddFee item={item} onAdd={onSave} onCancel={onCancel} />;
  if (item.kind === "component") return <AddComponentItem prices={prices} meta={meta} item={item} onAdd={onSave} onCancel={onCancel} />;
  if (isCustom) {
    if (!custom) return <div className="card shadow-sm border-0 mb-3"><div className="card-body text-muted">Loading&hellip;</div></div>;
    return <ProductEditor prices={prices} meta={meta} product={custom}
      onDone={(saved) => saved
        ? onSave({ kind: "custom", label: saved.description, config: saved.config || {}, pricing: saved.pricing, components: saved.components })
        : onCancel()}
      onCancel={onCancel} />;
  }
  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar">Edit Product</div>
      <div className="card-body">
        <ProductConfig prices={prices} initial={item} submitLabel="Save Changes"
          onAdd={async (it) => onSave(await resolveProduct(it))} onCancel={onCancel} />
      </div>
    </div>
  );
}

function JobEditor({ prices, meta, profile, orgId, jobId, onBack }) {
  const role = profile.role;
  // Staff may edit a custom product only until the job is saved. Managers always can.
  const [unlocked, setUnlocked] = useState({});   // product description -> editable this session
  const canEditItem = (it) => isManager(role) ? true : (it.kind === "custom" ? !!unlocked[it.label] : false);
  const [client, setClient] = useState("");
  const [zone, setZone] = useState(1);
  const [notes, setNotes] = useState([]);   // history
  const [newNote, setNewNote] = useState("");
  const [editNoteId, setEditNoteId] = useState(null);
  const [editNoteText, setEditNoteText] = useState("");
  const [items, setItems] = useState([]);
  const [adding, setAdding] = useState(false);
  const [addingFee, setAddingFee] = useState(false);
  const [addingComp, setAddingComp] = useState(false);
  const [editIdx, setEditIdx] = useState(null);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("items");
  const [err, setErr] = useState("");

  useEffect(() => {
    if (!jobId) return;
    (async () => {
      const { data, error } = await sb.from("jobs").select("*, job_items(*)").eq("id", jobId).single();
      if (error) { setErr(error.message); return; }
      setClient(data.client_name); setZone(data.zone);
      const { data: ns } = await sb.from("job_notes").select("*").eq("job_id", jobId).order("created_at", { ascending: false });
      setNotes(ns || []);
      setItems((data.job_items || []).map(it => ({ kind: it.kind, label: it.label, config: it.config, pricing: it.pricing, components: it.components })));
    })();
  }, [jobId]);

  const priceFor = (it) => zone === 2 ? { install: it.pricing.z2i, kit: it.pricing.z2k } : { install: it.pricing.z1i, kit: it.pricing.z1k };
  const totalInstall = items.reduce((s, it) => s + priceFor(it).install, 0);
  const totalKit = items.reduce((s, it) => s + priceFor(it).kit, 0);

  async function addNote() {
    const body = newNote.trim();
    if (!body || !jobId) return;
    const { data, error } = await sb.from("job_notes").insert({ org_id: orgId, job_id: jobId, body }).select().single();
    if (error) { setErr(error.message); return; }
    setNotes(ns => [data, ...ns]);
    setNewNote("");
  }
  async function saveNote(n) {
    const body = editNoteText.trim();
    if (!body) { alert("A note can't be empty."); return; }
    const now = new Date().toISOString();
    const { error } = await sb.from("job_notes").update({ body, updated_at: now }).eq("id", n.id);
    if (error) { setErr(error.message); return; }
    setNotes(ns => ns.map(x => x.id === n.id ? { ...x, body, updated_at: now } : x));
    setEditNoteId(null);
  }
  async function delNote(n) {
    if (!window.confirm("Delete this note?")) return;
    const { error } = await sb.from("job_notes").delete().eq("id", n.id);
    if (error) setErr(error.message); else setNotes(ns => ns.filter(x => x.id !== n.id));
  }
  async function save() {
    if (!client.trim()) { alert("Enter a client name."); return; }
    setSaving(true); setErr("");
    try {
      let jid = jobId;
      if (jid) {
        await sb.from("jobs").update({ client_name: client, zone }).eq("id", jid);
        await sb.from("job_items").delete().eq("job_id", jid);
      } else {
        const { data, error } = await sb.from("jobs").insert({ org_id: orgId, client_name: client, zone }).select().single();
        if (error) throw error;
        jid = data.id;
      }
      setUnlocked({});   // saved -> custom products are locked for staff
      if (newNote.trim()) {
        const { error } = await sb.from("job_notes").insert({ org_id: orgId, job_id: jid, body: newNote.trim() });
        if (error) throw error;
      }
      if (items.length) {
        const rows = items.map(it => ({ org_id: orgId, job_id: jid, kind: it.kind, label: it.label, config: it.config, pricing: it.pricing, components: it.components }));
        const { error } = await sb.from("job_items").insert(rows);
        if (error) throw error;
      }
      onBack();
    } catch (e) { setErr("Save failed: " + e.message); setSaving(false); }
  }

  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title={jobId ? "Edit Job" : "New Job"} right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-brand btn-sm" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save Job"}</button>
        </div>} />
      {err && <div className="alert alert-warning">{err}</div>}
      <div className="card shadow-sm border-0 mb-3">
        <div className="card-body row g-2">
          <div className="col-md-8"><label className="form-label small fw-semibold">Client name</label><input className="form-control" value={client} onChange={e => setClient(e.target.value)} /></div>
          <div className="col-md-4"><label className="form-label small fw-semibold">Zone</label>
            <select className="form-select" value={zone} onChange={e => setZone(+e.target.value)}><option value={1}>Zone 1</option><option value={2}>Zone 2</option></select></div>
        </div>
      </div>

      <div className="card shadow-sm border-0 mb-3">
        <div className="card-header card-title-bar">Notes</div>
        <div className="card-body">
          <textarea className="form-control" rows={2} placeholder="Add a note&hellip;" value={newNote} onChange={e => setNewNote(e.target.value)} />
          <div className="d-flex align-items-center gap-2 mt-2">
            <button className="btn btn-sm btn-brand" disabled={!newNote.trim() || !jobId} onClick={addNote}>Save Note</button>
            {!jobId && <span className="text-muted small">Save the job first &mdash; or type a note and it'll be added when you save.</span>}
          </div>
          {notes.length > 0 && <ul className="list-group list-group-flush mt-3">
            {notes.map(n => (
              <li key={n.id} className="list-group-item px-0">
                {editNoteId === n.id ? (
                  <div>
                    <textarea className="form-control" rows={2} autoFocus value={editNoteText} onChange={e => setEditNoteText(e.target.value)} />
                    <div className="d-flex gap-2 mt-2">
                      <button className="btn btn-sm btn-brand" onClick={() => saveNote(n)}>Save Note</button>
                      <button className="btn btn-sm btn-outline-secondary" onClick={() => setEditNoteId(null)}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div className="d-flex justify-content-between align-items-start">
                    <span>
                      <div style={{ whiteSpace: "pre-wrap" }}>{n.body}</div>
                      <div className="text-muted" style={{ fontSize: ".72rem" }}>{new Date(n.created_at).toLocaleString()}{n.updated_at ? " \u00b7 edited " + new Date(n.updated_at).toLocaleString() : ""}</div>
                    </span>
                    <span className="d-flex gap-2 ms-3">
                      <button className="btn btn-sm btn-outline-secondary" onClick={() => { setEditNoteId(n.id); setEditNoteText(n.body); }}>Edit</button>
                      <button className="btn btn-sm btn-outline-danger" onClick={() => delNote(n)}>&times;</button>
                    </span>
                  </div>
                )}
              </li>
            ))}
          </ul>}
        </div>
      </div>

      <ul className="nav nav-tabs mb-3">
        <li className="nav-item"><button className={"nav-link " + (tab === "items" ? "active" : "")} onClick={() => setTab("items")}>Products</button></li>
        <li className="nav-item"><button className={"nav-link " + (tab === "pull" ? "active" : "")} onClick={() => setTab("pull")}>Pull List</button></li>
      </ul>

      {tab === "items" ? (
        <div>
          {editIdx !== null ? <EditItem prices={prices} meta={meta} item={items[editIdx]}
                    onSave={it => { setItems(its => its.map((x, j) => j === editIdx ? it : x)); if (it.kind === "custom") setUnlocked(u => ({ ...u, [it.label]: true })); setEditIdx(null); }}
                    onCancel={() => setEditIdx(null)} />
           : adding ? <AddProduct prices={prices} meta={meta} onAdd={it => { setItems([...items, it]); if (it.kind === "custom") setUnlocked(u => ({ ...u, [it.label]: true })); setAdding(false); }} onCancel={() => setAdding(false)} />
           : addingFee ? <AddFee onAdd={it => { setItems([...items, it]); setAddingFee(false); }} onCancel={() => setAddingFee(false)} />
           : addingComp ? <AddComponentItem prices={prices} meta={meta} onAdd={it => { setItems([...items, it]); setAddingComp(false); }} onCancel={() => setAddingComp(false)} />
                    : <div className="d-flex gap-2 mb-3">
                        <button className="btn btn-brand" onClick={() => setAdding(true)}>+ Add Product</button>
                        <button className="btn btn-outline-secondary" onClick={() => setAddingComp(true)}>+ Add Component</button>
                        <button className="btn btn-outline-secondary" onClick={() => setAddingFee(true)}>+ Add Job Fee</button>
                      </div>}
          <div className="card shadow-sm border-0">
            <div className="card-header card-title-bar">Products on this Job</div>
            {items.length === 0 ? <div className="card-body text-muted">No products yet.</div> :
              <table className="table mb-0">
                <thead><tr><th>Product</th><th className="text-end">Install ({"Z" + zone})</th><th className="text-end">Kit</th><th></th></tr></thead>
                <tbody>
                  {items.map((it, i) => it.kind === "fee" ? null : (
                    <tr key={i}>
                      <td>{it.label}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).install)}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).kit)}</td>
                      <td className="text-end">
                        <div className="d-flex gap-2 justify-content-end">
                          {(isManager(role) || it.kind === "fee" || it.kind === "component" || canEditItem(it)) && <button className="btn btn-sm btn-outline-secondary" onClick={() => { setAdding(false); setAddingFee(false); setAddingComp(false); setEditIdx(i); }}>Edit</button>}
                          <button className="btn btn-sm btn-outline-danger" onClick={() => setItems(items.filter((_, j) => j !== i))}>Remove</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {items.some(it => it.kind === "fee") && <tr><td className="cat-hdr" colSpan={4}>Job Fees</td></tr>}
                  {items.map((it, i) => it.kind !== "fee" ? null : (
                    <tr key={i}>
                      <td>{it.label}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).install)}</td>
                      <td className="text-end est-num">{usd.format(priceFor(it).kit)}</td>
                      <td className="text-end">
                        <div className="d-flex gap-2 justify-content-end">
                          {(isManager(role) || it.kind === "fee" || it.kind === "component" || canEditItem(it)) && <button className="btn btn-sm btn-outline-secondary" onClick={() => { setAdding(false); setAddingFee(false); setAddingComp(false); setEditIdx(i); }}>Edit</button>}
                          <button className="btn btn-sm btn-outline-danger" onClick={() => setItems(items.filter((_, j) => j !== i))}>Remove</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  <tr className="fw-bold"><td>Job Total</td><td className="text-end est-num">{usd.format(totalInstall)}</td><td className="text-end est-num">{usd.format(totalKit)}</td><td></td></tr>
                </tbody>
              </table>}
          </div>
        </div>
      ) : (
        <div>
          <button className="btn btn-brand mb-3" onClick={() => printPullList({ client, zone, notes, items, meta })}>Print Pull List</button>
          <PullList items={items} meta={meta} />
        </div>
      )}
    </div>
  );
}

function PriceSheets({ prices, profile, onBack }) {
  const [table, setTable] = useState("OpenRoof");
  const [model, setModel] = useState("Premium");
  const [zone, setZone] = useState(1);
  const [ptype, setPtype] = useState("install");
  const [exporting, setExporting] = useState(false);
  const gridRef = React.useRef(null);
  const isBarn = table === "OpenRoof" || table === "LeanTo";
  const zk = (zone === 2 ? "z2" : "z1") + (ptype === "kit" ? "k" : "i");
  const [customs, setCustoms] = useState([]);
  useEffect(() => { (async () => {
    const { data } = await sb.from("products").select("*").eq("kind", "custom").order("description");
    setCustoms(data || []);
  })(); }, []);

  const HEIGHTS = [8, 10, 12, 14, 16, 18];
  const CW = (function(){ const a=[]; for (let w = 12; w <= 60; w += 2) a.push(w); return a; })();
  const BS_LENGTHS = [20, 24, 30, 36, 40, 48, 50, 60];

  const barnCell = (w, l) => priceBarn({ model, roofType: table, width: w, length: l, poleSpacing: autoSpacing(l) || 10, postSize: postForWidth(model, w), gauge: "29", finish: "Galvalume" }, prices)[zk];
  const clo = (cfg) => priceClosure(cfg, prices)[zk];

  const TITLES = { OpenRoof: "Open Roof", LeanTo: "Lean-To", EachEnd: "Each End Closed", BothSides: "Both Sides Closed", GableEnd: "Gable End", Custom: "Custom Products" };
  const title = (isBarn ? model.toUpperCase() + " \u2014 " : "") + "Zone " + zone + " \u2014 " + TITLES[table] + " \u2014 " + (ptype === "kit" ? "Kit" : "Install");

  const BARN_THEME = {
    Premium: { header: "#cceed2", stripe: "#00ac1f" },
    Regular: { header: "#d7eaec", stripe: "#39959f" },
    Base:    { header: "#f3e9db", stripe: "#c1904a" },
  };
  const t = isBarn ? BARN_THEME[model] : { header: "#fff", stripe: "#d9d9d9" };
  const bd = "1px solid #000";
  const cellW = { OpenRoof: "82px", LeanTo: "64px", EachEnd: "96px", BothSides: "96px", GableEnd: "96px" }[table];
  const labelW = cellW;
  const cellPad = isBarn ? (table === "LeanTo" ? "3px 5px" : "2px 8px") : (table === "BothSides" ? "8px 6px" : "5px 6px");
  const base = { border: bd, padding: cellPad, textAlign: "center", whiteSpace: "nowrap", fontSize: isBarn ? "12.5px" : "14px", fontWeight: 700, fontVariantNumeric: "tabular-nums", width: cellW };
  const thStyle = { ...base, background: t.header, color: "#1c1f23", fontWeight: 700, textDecoration: "underline" };
  const thColStyle = { ...thStyle, background: t.stripe };
  const tdStyle = { ...base, color: "#1c1f23", fontWeight: 700 };
  const cornerStyle = { ...base, width: labelW, background: "#1c1f23", color: "#fff", fontWeight: 700, textDecoration: "none" };
  const rowLabelStyle = { ...base, width: labelW, background: "#fff", color: "#1c1f23", fontWeight: 700, textDecoration: "underline" };

  async function exportPng() {
    if (!gridRef.current) return;
    setExporting(true);
    try {
      const el = gridRef.current;
      const rect = el.getBoundingClientRect();
      const canvas = await html2canvas(el, { scale: 3, backgroundColor: "#000000", width: Math.round(rect.width), height: Math.round(rect.height) });
      const link = document.createElement("a");
      link.download = title.replace(/[^a-z0-9]+/gi, "_") + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (e) { alert("Export failed: " + e.message); }
    setExporting(false);
  }
  const sel = (val, set, opts) => <select className="form-select form-select-sm" style={{ width: "auto" }} value={val} onChange={e => set(e.target.value)}>{opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>;

  function renderGrid() {
    if (isBarn) {
      const widths = table === "OpenRoof" ? OPEN_WIDTHS : LEAN_WIDTHS;
      const lengths = table === "OpenRoof" ? OPEN_LENGTHS : LEAN_LENGTHS;
      return (
        <table style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
          <thead><tr><th style={cornerStyle}>Size</th>{lengths.map((l, li) => <th key={l} style={li % 2 ? thColStyle : thStyle}>{l}</th>)}</tr></thead>
          <tbody>{widths.map(w => (
            <tr key={w}><th style={thStyle}>{w}</th>
              {lengths.map((l, li) => <td key={l} style={{ ...tdStyle, background: li % 2 ? t.stripe : "#fff" }}>{"$" + barnCell(w, l).toLocaleString()}</td>)}
            </tr>
          ))}</tbody>
        </table>
      );
    }
    if (table === "EachEnd") {
      return (
        <table style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
          <thead><tr><th style={cornerStyle}></th>{HEIGHTS.map((h, li) => <th key={h} style={li % 2 === 0 ? thColStyle : thStyle}>{h}</th>)}<th style={HEIGHTS.length % 2 === 0 ? thColStyle : thStyle}>Wainscot</th></tr></thead>
          <tbody>{CW.map(w => (
            <tr key={w}><th style={rowLabelStyle}>{w}</th>
              {HEIGHTS.map((h, li) => <td key={h} style={{ ...tdStyle, background: li % 2 === 0 ? t.stripe : "#fff" }}>{"$" + clo({ option: "Each End Closed", width: w, height: h }).toLocaleString()}</td>)}
              <td style={{ ...tdStyle, background: HEIGHTS.length % 2 === 0 ? t.stripe : "#fff" }}>{"$" + clo({ option: "Wainscot Endwall", width: w }).toLocaleString()}</td>
            </tr>
          ))}</tbody>
        </table>
      );
    }
    if (table === "BothSides") {
      return (
        <table style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
          <thead><tr><th style={cornerStyle}></th>{HEIGHTS.map((h, li) => <th key={h} style={li % 2 === 0 ? thColStyle : thStyle}>{h + "' Tall"}</th>)}<th style={HEIGHTS.length % 2 === 0 ? thColStyle : thStyle}>Wainscot</th><th style={(HEIGHTS.length + 1) % 2 === 0 ? thColStyle : thStyle}>4' Drop Panel</th></tr></thead>
          <tbody>{BS_LENGTHS.map(l => (
            <tr key={l}><th style={rowLabelStyle}>{l}</th>
              {HEIGHTS.map((h, li) => <td key={h} style={{ ...tdStyle, background: li % 2 === 0 ? t.stripe : "#fff" }}>{"$" + clo({ option: "Both Sides Closed", length: l, height: h, poleSpacing: autoSpacing(l) || 10 }).toLocaleString()}</td>)}
              <td style={{ ...tdStyle, background: HEIGHTS.length % 2 === 0 ? t.stripe : "#fff" }}>{"$" + (2 * clo({ option: "Wainscot Sidewall", length: l })).toLocaleString()}</td>
              <td style={{ ...tdStyle, background: (HEIGHTS.length + 1) % 2 === 0 ? t.stripe : "#fff" }}>{"$" + (2 * clo({ option: "4' Drop Panel", length: l, poleSpacing: autoSpacing(l) || 10 })).toLocaleString()}</td>
            </tr>
          ))}</tbody>
        </table>
      );
    }
    if (table === "Custom") {
      const wide = { ...base, width: "260px" }, descW = { ...base, width: "320px" };
      return (
        <table style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
          <thead><tr>
            <th style={{ ...cornerStyle, width: "260px" }}>Product</th>
            <th style={{ ...thStyle, width: "320px", background: "#fff" }}>Description</th>
            <th style={{ ...thColStyle, width: "110px" }}>Price</th>
          </tr></thead>
          <tbody>{customs.length === 0 ? <tr><td style={{ ...wide, textAlign: "left" }} colSpan={3}>No custom products yet.</td></tr> :
            customs.map(p => (
              <tr key={p.id}>
                <td style={{ ...wide, background: "#fff", textAlign: "left" }}>{p.description}</td>
                <td style={{ ...descW, background: "#fff", textAlign: "left", fontWeight: 400, whiteSpace: "normal" }}>{p.description_text || ""}</td>
                <td style={{ ...base, width: "110px", background: t.stripe }}>{"$" + ((p.pricing && p.pricing[zk]) || 0).toLocaleString()}</td>
              </tr>
            ))}</tbody>
        </table>
      );
    }
    // Gable End: two-up width/price pairs
    const half = Math.ceil(CW.length / 2);
    const left = CW.slice(0, half), right = CW.slice(half);
    const gcell = (w) => "$" + clo({ option: "Gable End Closed", width: w, height: 8 }).toLocaleString();
    return (
      <table style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
        <tbody>{left.map((w, i) => (
          <tr key={w}>
            <th style={rowLabelStyle}>{w}</th><td style={{ ...tdStyle, background: t.stripe }}>{gcell(w)}</td>
            <th style={rowLabelStyle}>{right[i] !== undefined ? right[i] : ""}</th>
            <td style={{ ...tdStyle, background: t.stripe }}>{right[i] !== undefined ? gcell(right[i]) : ""}</td>
          </tr>
        ))}</tbody>
      </table>
    );
  }

  return (
    <div className="container py-4" style={{ maxWidth: 1000 }}>
      <Header title="Price Sheets" right={onBack ? <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button> : null} />
      <div className="card shadow-sm border-0 mb-3"><div className="card-body d-flex flex-wrap gap-2 align-items-center">
        {sel(table, setTable, [["OpenRoof","Open Roof"],["LeanTo","Lean-To"],["EachEnd","Each End Closed"],["BothSides","Both Sides Closed"],["GableEnd","Gable End"],["Custom","Custom Products"]])}
        {isBarn && sel(model, setModel, [["Premium","Premium"],["Regular","Regular"],["Base","Base"]])}
        {sel(zone, v => setZone(+v), [[1,"Zone 1"],[2,"Zone 2"]])}
        {sel(ptype, setPtype, [["install","Install Price"],["kit","Kit Price"]])}
        <button className="btn btn-brand btn-sm ms-auto" disabled={exporting} onClick={exportPng}>{exporting ? "Exporting\u2026" : "Export PNG"}</button>
      </div></div>
      <div className="pricegrid-title">{title}</div>
      <div style={{ overflowX: "auto" }}>
        <div ref={gridRef} style={{ display: "inline-block" }}>{renderGrid()}</div>
      </div>
      <p className="text-muted small mt-2">Live from current component prices. Export PNG and drop it into your Canva sheet as an image.</p>
    </div>
  );
}

// Edit a product: its label/description, and its component lines.
function ProductEditor({ prices, meta, product, onDone, onCancel }) {
  const isNew = !product.id;
  const isCustom = product.kind === "custom";
  const [desc, setDesc] = useState(product.description || "");
  const [about, setAbout] = useState(product.description_text || "");
  const [lines, setLines] = useState(() => (product.components || []).map(c => ({ ...c })));
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  // Components created here are saved to the components table and usable immediately.
  const [extra, setExtra] = useState({ prices: {}, meta: {} });
  const [nc, setNc] = useState(null); // new-component form
  const ePrices = { ...prices, ...extra.prices };
  const eMeta = { ...meta, ...extra.meta };
  const refs = Object.keys(eMeta || {}).sort((a, b) => (eMeta[a].label || a).localeCompare(eMeta[b].label || b));

  async function createComponent() {
    const label = (nc.label || "").trim();
    if (!label) { alert("Enter a component name."); return; }
    const ref = makeRef(label);
    const price = Number(nc.price) || 0;
    const { error } = await sb.from("components").insert({ reference: ref, label, category: nc.category, price });
    if (error) { alert("Couldn't create component: " + error.message); return; }
    setExtra(x => ({ prices: { ...x.prices, [ref]: price }, meta: { ...x.meta, [ref]: { label, category: nc.category } } }));
    setLines(ls => [...ls, { ref, name: label, quantity: 1, length: 1, unitPrice: price }]);
    setNc(null);
  }

  const setLine = (i, k, v) => setLines(ls => ls.map((l, j) => j === i ? { ...l, [k]: v } : l));
  const addLine = () => setLines(ls => [...ls, { ref: refs[0], name: (eMeta[refs[0]] || {}).label || refs[0], quantity: 1, length: 1, unitPrice: ePrices[refs[0]] || 0 }]);
  const delLine = (i) => setLines(ls => ls.filter((_, j) => j !== i));

  const clean = lines.map(l => ({ ...l, quantity: +l.quantity || 0, length: +l.length || 1, unitPrice: ePrices[l.ref] != null ? ePrices[l.ref] : (l.unitPrice || 0) }));
  const cost = materialCost(clean, ePrices);

  async function save() {
    if (!desc.trim()) { alert("Enter a product name."); return; }
    setSaving(true); setErr("");
    try {
      const pricing = isCustom ? priceCustom(clean, ePrices) : repriceEdited(product.pricing || {}, product.components || [], clean, ePrices);
      const row = { kind: product.kind, description: desc.trim(), description_text: about, config: product.config || {}, pricing, components: clean };
      let saved = null;
      if (product.id) { const { data, error } = await sb.from("products").update(row).eq("id", product.id).select().single(); if (error) throw error; saved = data; }
      else { const { data, error } = await sb.from("products").insert(row).select().single(); if (error) throw error; saved = data; }
      onDone(saved);
    } catch (e) { setErr(e.message); setSaving(false); }
  }

  return (
    <div className="card shadow-sm border-0 mb-3">
      <div className="card-header card-title-bar">{isNew ? "New Custom Product" : "Edit Product"}</div>
      <div className="card-body">
        {err && <div className="alert alert-warning py-2">{err}</div>}
        <div className="row g-2 mb-3">
          <div className="col-md-6"><label className="form-label small fw-semibold">Product name</label>
            <input className="form-control" value={desc} onChange={e => setDesc(e.target.value)} disabled={!isCustom} />
            {!isCustom && <div className="form-text">Standard products are named by the calculator.</div>}</div>
          <div className="col-md-6"><label className="form-label small fw-semibold">What it is / includes</label>
            <input className="form-control" value={about} onChange={e => setAbout(e.target.value)} placeholder="e.g. Enclosure over a well pump head" />
            <div className="form-text">Shows on the price sheet as the product's description.</div></div>
        </div>
        <div className="d-flex justify-content-between align-items-center mb-1">
          <span className="fw-semibold small">Components</span>
          <div className="d-flex gap-2">
            <button className="btn btn-sm btn-outline-secondary" onClick={addLine}>+ Add Existing</button>
            <button className="btn btn-sm btn-outline-secondary" onClick={() => setNc({ label: "", category: "Custom", price: "" })}>+ New Component</button>
          </div>
        </div>
        {nc && <div className="border rounded p-2 mb-2 bg-light">
          <div className="row g-2 align-items-end">
            <div className="col-md-5"><label className="form-label small fw-semibold mb-0">New component name</label>
              <input className="form-control form-control-sm" autoFocus value={nc.label} onChange={e => setNc({ ...nc, label: e.target.value })} placeholder="e.g. 4x4x8 PT Post" /></div>
            <div className="col-md-3"><label className="form-label small fw-semibold mb-0">Category</label>
              <select className="form-select form-select-sm" value={nc.category} onChange={e => setNc({ ...nc, category: e.target.value })}>
                {[...CAT_ORDER, "Rates & Fees"].map(c => <option key={c} value={c}>{c}</option>)}
              </select></div>
            <div className="col-md-2"><label className="form-label small fw-semibold mb-0">Price</label>
              <input className="form-control form-control-sm text-end" type="number" step="0.01" value={nc.price} onChange={e => setNc({ ...nc, price: e.target.value })} /></div>
            <div className="col-md-2 d-flex gap-1">
              <button className="btn btn-sm btn-brand" onClick={createComponent}>Create</button>
              <button className="btn btn-sm btn-outline-secondary" onClick={() => setNc(null)}>Cancel</button>
            </div>
          </div>
          <div className="form-text">Saved to your Components list and added to this product.</div>
        </div>}
        <table className="table table-sm align-middle">
          <thead><tr><th style={{ width: "50%" }}>Component</th><th style={{ width: "15%" }}>Qty</th><th style={{ width: "15%" }}>Length</th><th className="text-end">Cost</th><th></th></tr></thead>
          <tbody>
            {lines.length === 0 && <tr><td colSpan={5} className="text-muted">No components yet.</td></tr>}
            {lines.map((l, i) => (
              <tr key={i}>
                <td><select className="form-select form-select-sm" value={l.ref || ""} onChange={e => { const v = e.target.value; setLines(ls => ls.map((x, j) => j === i ? { ...x, ref: v, name: (eMeta[v] || {}).label || v, unitPrice: ePrices[v] || 0 } : x)); }}>
                  {!l.ref && <option value="">{l.name} (no reference)</option>}
                  {refs.map(rf => <option key={rf} value={rf}>{(eMeta[rf] || {}).label || rf}</option>)}
                </select></td>
                <td><input className="form-control form-control-sm text-end" type="number" value={l.quantity} onChange={e => setLine(i, "quantity", e.target.value)} /></td>
                <td><input className="form-control form-control-sm text-end" type="number" value={l.length} onChange={e => setLine(i, "length", e.target.value)} /></td>
                <td className="text-end est-num">{usd.format((+l.quantity || 0) * (+l.length || 1) * (ePrices[l.ref] != null ? ePrices[l.ref] : (l.unitPrice || 0)))}</td>
                <td className="text-end"><button className="btn btn-sm btn-outline-danger" onClick={() => delLine(i)}>&times;</button></td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="d-flex justify-content-between align-items-center">
          <div className="text-muted small">Material cost: <b className="est-num">{usd.format(cost)}</b></div>
          <div className="d-flex gap-2">
            <button className="btn btn-outline-secondary" onClick={onCancel}>Cancel</button>
            <button className="btn btn-brand" disabled={saving} onClick={save}>{saving ? "Saving\u2026" : "Save Product"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProductsView({ prices, meta, orgId, onBack }) {
  const [products, setProducts] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [seeding, setSeeding] = useState(false);
  const [progress, setProgress] = useState(0);
  const [err, setErr] = useState("");
  async function load() {
    try {
      const all = []; const SIZE = 1000;
      for (let from = 0; ; from += SIZE) {
        let pq = sb.from("products").select("*").order("description").range(from, from + SIZE - 1);
        if (orgId) pq = pq.eq("org_id", orgId);
        const { data, error } = await pq;
        if (error) throw error;
        all.push(...(data || []));
        if (!data || data.length < SIZE) break;
      }
      setProducts(all);
    } catch (e) { setErr(e.message); }
  }
  useEffect(() => { load(); }, [orgId]);
  function grouped(comps) {
    const by = {};
    (comps || []).filter(c => NON_MATERIAL_CATS.indexOf(catFor(c, meta)) === -1).forEach(c => { const cat = catFor(c, meta); (by[cat] = by[cat] || []).push(c); });
    return [...CAT_ORDER, ...NON_MATERIAL_CATS].filter(cat => by[cat]).map(cat => [cat, by[cat]]);
  }
  async function seedCatalog() {
    if (!window.confirm("Add all " + FULL_CATALOG.length + " standard products (barns + closures) from the price sheets? Existing ones with the same description are refreshed at current prices.")) return;
    setSeeding(true); setProgress(0); setErr("");
    try {
      const rows = FULL_CATALOG.map(c => { const p = c.kind === "closure" ? priceClosure(c.config, prices) : priceBarn(c.config, prices); return { org_id: orgId, kind: c.kind, description: c.description, config: c.config, pricing: p, components: p.components }; });
      const CHUNK = 200;
      for (let i = 0; i < rows.length; i += CHUNK) {
        // Uniqueness is per company now: (org_id, description). org_id fills in from its
        // column default (my_org()), so the app never has to send it.
        const { error } = await sb.from("products").upsert(rows.slice(i, i + CHUNK), { onConflict: "org_id,description" });
        if (error) throw error;
        setProgress(Math.min(rows.length, i + CHUNK));
      }
      await load();
    } catch (e) { setErr("Seed failed: " + e.message); }
    setSeeding(false);
  }
  // Standard products whose description no longer matches the catalog -- e.g. seeded
  // before the post-by-width rule, so their name has the wrong post size.
  const stale = (products || []).filter(p => p.kind !== "custom" && !isOnPriceSheet(p.description));
  async function cleanUp() {
    if (!window.confirm("Remove " + stale.length + " product(s) that no longer match the price sheets?\n\nThese are outdated entries (e.g. seeded before the post-size rule) and one-off sizes you calculated. Custom products are kept. Saved jobs keep their own copies and are unaffected.")) return;
    setErr("");
    try {
      const ids = stale.map(p => p.id);
      for (let i = 0; i < ids.length; i += 200) {
        const { error } = await sb.from("products").delete().in("id", ids.slice(i, i + 200));
        if (error) throw error;
      }
      await load();
    } catch (e) { setErr("Cleanup failed: " + e.message); }
  }
  async function del(p) {
    if (!window.confirm("Delete \"" + p.description + "\"? This can't be undone.")) return;
    const { error } = await sb.from("products").delete().eq("id", p.id);
    if (error) setErr(error.message); else load();
  }
  if (editing) return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Products" right={<button className="btn btn-outline-light btn-sm" onClick={() => setEditing(null)}>Back</button>} />
      <ProductEditor prices={prices} meta={meta} product={editing} onDone={() => { setEditing(null); load(); }} onCancel={() => setEditing(null)} />
    </div>
  );
  const tokens = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const shown = (products || [])
    .filter(p => filter === "all" || (filter === "custom" ? p.kind === "custom" : filter === "stale" ? (p.kind !== "custom" && !isOnPriceSheet(p.description)) : isOnPriceSheet(p.description)))
    .filter(p => tokens.every(t => p.description.toLowerCase().includes(t)));
  return (
    <div className="container py-4" style={{ maxWidth: 900 }}>
      <Header title="Products" right={
        <div className="d-flex gap-2">
          <button className="btn btn-outline-light btn-sm" onClick={onBack}>Back</button>
          <button className="btn btn-outline-light btn-sm" onClick={() => setEditing({ kind: "custom", components: [] })}>+ Custom</button>
          {stale.length > 0 && <button className="btn btn-outline-warning btn-sm" onClick={cleanUp}>Remove {stale.length} Outdated</button>}
          <button className="btn btn-brand btn-sm" disabled={seeding} onClick={seedCatalog}>{seeding ? ("Loading " + progress + "/" + FULL_CATALOG.length) : "Load Catalog"}</button>
        </div>} />
      {err && <div className="alert alert-warning">{err}</div>}
      <div className="d-flex gap-2 mb-3">
        <input className="form-control" placeholder="Search products, e.g. 12x60 premium open" value={q} onChange={e => setQ(e.target.value)} />
        <select className="form-select" style={{ width: "auto" }} value={filter} onChange={e => setFilter(e.target.value)}>
          <option value="all">All</option><option value="sheets">On Price Sheets</option><option value="custom">Custom</option><option value="stale">Not on Sheets</option>
        </select>
      </div>
      {products === null ? <p className="text-muted">Loading&hellip;</p> :
        products.length === 0 ? <p className="text-muted">No products yet. Click <b>Load Catalog</b> for the standard sizes, or <b>+ Custom</b> to create one.</p> :
        <div className="card shadow-sm border-0">
          <div className="card-header card-title-bar">Products ({shown.length}{shown.length !== products.length ? " of " + products.length : ""})</div>
          <ul className="list-group list-group-flush">
            {shown.slice(0, 300).map(p => (
              <li key={p.id} className="list-group-item">
                <div className="d-flex justify-content-between align-items-center">
                  <div style={{ cursor: "pointer" }} onClick={() => setOpenId(openId === p.id ? null : p.id)}>
                    <span>{p.description}</span>
                    {isOnPriceSheet(p.description) && <span className="badge ms-2" style={{ background: "#D4AF37", color: "#1c1f23" }}>On Price Sheets</span>}
                    {p.kind === "custom" && <span className="badge text-bg-secondary ms-2">Custom</span>}
                    {p.description_text && <div className="text-muted small">{p.description_text}</div>}
                  </div>
                  <div className="d-flex gap-2">
                    <button className="btn btn-sm btn-outline-secondary" onClick={() => setEditing(p)}>Edit</button>
                    <button className="btn btn-sm btn-outline-danger" onClick={() => del(p)}>Delete</button>
                  </div>
                </div>
                {openId === p.id && <div className="mt-2">
                  <table className="table table-sm table-striped mb-0">
                    <thead><tr><th>Component</th><th className="text-end">Qty</th><th className="text-end">Length</th></tr></thead>
                    <tbody>{grouped(p.components).map(([cat, cs]) => (
                      <React.Fragment key={cat}>
                        <tr><td className="cat-hdr" colSpan={3}>{cat}</td></tr>
                        {cs.map((c, i) => <tr key={i}><td>{labelFor(c, meta)}</td><td className="text-end est-num">{c.quantity}</td><td className="text-end est-num">{c.length}</td></tr>)}
                      </React.Fragment>
                    ))}</tbody>
                  </table>
                </div>}
              </li>
            ))}
          </ul>
          {shown.length > 300 && <div className="card-footer text-muted small">Showing first 300 &mdash; narrow with the search box.</div>}
        </div>}
    </div>
  );
}
